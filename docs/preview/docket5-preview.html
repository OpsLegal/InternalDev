<title>Docket 5 Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
<style>
/* Layout: one phone-width column, the app's own screens stacked above a bottom tab bar, like the Android app. */
:root {
  --bg: #FAFAF7; --surface: #FFFFFF; --variant: #F1F2F4; --outline: #D0D4D9;
  --fg: #1B1F24; --muted: #5B6470; --primary: #3D4A57;
  --yellow: #FFE14D; --ink: #1F2933;
  --navy: #1F2A44; --slate: #46505E; --bordeaux: #5C2A33; --pewter: #6B7280; --rec: #9B2C2C;
  --k-task: #1E4E8C; --k-meet: #111111; --k-dead: #B3261E;
  --k-task-y: #1E4E8C; --k-meet-y: #111111; --k-dead-y: #B3261E;
  --k-proj: #1B6B43; --k-proj-y: #1B6B43; --bar: #2E8B57;
  --dialog: rgba(255,255,255,.97); --scrim: rgba(0,0,0,.25); --error: #B3261E;
  --font: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15181B; --surface: #1C2024; --variant: #262B30; --outline: #3A4148;
  --fg: #E6E8EA; --muted: #A3ABB4; --primary: #C6D0DA;
  --k-task: #9DB8E8; --k-meet: #F1F1F1; --k-dead: #F2A7A0; --k-proj: #86D3A8; --bar: #5BBF8A;
  --dialog: rgba(28,32,36,.97); --scrim: rgba(0,0,0,.45); --error: #F2A7A0; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15181B; --surface: #1C2024; --variant: #262B30; --outline: #3A4148;
  --fg: #E6E8EA; --muted: #A3ABB4; --primary: #C6D0DA;
  --k-task: #9DB8E8; --k-meet: #F1F1F1; --k-dead: #F2A7A0; --k-proj: #86D3A8; --bar: #5BBF8A;
  --dialog: rgba(28,32,36,.97); --scrim: rgba(0,0,0,.45); --error: #F2A7A0; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.4 var(--font); }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
.app { max-width: 480px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; position: relative; }
.screen { flex: 1; overflow-y: auto; padding: 8px 16px 24px; min-height: 0; }
.bar { display: flex; justify-content: space-around; border-top: 1px solid var(--outline); background: var(--surface);
  padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0px)); }
.bar button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 12px; color: var(--muted); padding: 4px 10px; border-radius: 16px; cursor: pointer; }
.bar button[aria-current="page"] { color: var(--fg); font-weight: 500; }
.bar button[aria-current="page"] svg { background: var(--variant); border-radius: 12px; }
.bar svg { width: 44px; height: 26px; padding: 3px 10px; }
.bar button { padding: 4px 4px; }
.proj-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 12px; cursor: pointer; border: 0; width: 100%; text-align: left; }
.pct { font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }
.track { position: relative; height: 10px; border-radius: 5px; background: var(--variant); grid-column: 1 / -1; }
.track .done { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 5px; background: var(--bar); }
.track .plan { position: absolute; top: 3px; bottom: 3px; border-radius: 3px; background: color-mix(in srgb, var(--bar) 35%, transparent); }
.track .late { position: absolute; top: 3px; bottom: 3px; border-radius: 3px; background: var(--k-dead); }

.track .today { background: var(--fg); } .track .dl { background: var(--k-dead); }
.status { font-size: 12px; } .status.late { color: var(--k-dead); font-weight: 500; } .status.ok { color: var(--k-proj); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

h1 { font-size: 22px; font-weight: 700; margin: 8px 0; }
h2 { font-size: 20px; font-weight: 400; margin: 18px 0 4px; }
.small { font-size: 12px; color: var(--muted); }
.note { font-size: 12px; color: var(--muted); background: var(--variant); border-radius: 8px; padding: 8px 10px; }
.card { background: var(--surface); border-radius: 12px; padding: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.row { display: flex; gap: 8px; align-items: center; }
.wrap { display: flex; flex-wrap: wrap; gap: 6px; }
.grow { flex: 1; min-width: 0; }

/* Table */
.gaps { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.table { display: flex; flex-direction: column; gap: 3px; }
.line { display: grid; grid-template-columns: 40px repeat(5, minmax(0, 1fr)); gap: 3px; height: 62px; }
/* The day's events sit on the same background as its day label, joined to it: one block that reads as that day. */
.calstrip { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.calstrip button.added { background: var(--fg); color: var(--bg); border-style: solid; }
.calstrip.alldone { background: var(--yellow); }
.calstrip.alldone button.skipped { border-color: rgba(0,0,0,.3); }
.day.joined { border-top-left-radius: 0; border-top-right-radius: 0; }

.calstrip button.skipped { border: 1px solid var(--yellow); background: var(--yellow); color: var(--ink); }
.line.today { outline: 2px solid var(--primary); outline-offset: 1px; border-radius: 8px; }
.day, .cell { border-radius: 6px; display: flex; align-items: center; justify-content: center; text-align: center; min-width: 0; }
.day { background: var(--surface); font-size: 13px; flex-direction: column; gap: 3px; }
/* The day's calendar: dark with a count = events to review; yellow = all reviewed; light 0 = none. Tap to see them. */
.calbadge { font: inherit; font-size: 10px; font-weight: 700; line-height: 1; border-radius: 9px; padding: 3px 5px; cursor: pointer;
  border: 1px solid var(--outline); background: transparent; color: var(--muted); }
.calbadge.todo { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.calbadge.ok { background: var(--yellow); color: var(--ink); border-color: rgba(0,0,0,.25); }
.day.alldone { background: var(--yellow); color: var(--ink); }
.cell { border: 1px solid var(--outline); background: var(--bg); padding: 3px; font-size: 10.5px; line-height: 1.2;
  overflow: hidden; cursor: pointer; }
.cell.filled { background: var(--variant); }
.cell.done { background: var(--yellow); }
.cell.grey { background: var(--outline); color: var(--muted); }
.cell.cancelled span { text-decoration: line-through; }
.cell span { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
.cell.past { cursor: default; }
.cell.italic span { font-style: italic; }
.k-PROJECT { color: var(--k-proj); } .done.k-PROJECT { color: var(--k-proj-y); }
.cell.proj { box-shadow: inset 3px 0 0 var(--bar); }
.projlink { border: 0; background: none; padding: 0; color: var(--k-proj); font-weight: 500; cursor: pointer; font-size: 13px; text-decoration: underline; text-underline-offset: 2px; }
.head { display: flex; align-items: center; gap: 8px; }
/* The top of the table stays put: title, Today, the bell and any message are always in sight. */
.buymic { display: flex; gap: 12px; align-items: center; }
.buymic .round { width: 52px; height: 52px; flex: none; }
.buymic .round.rec { background: #9B2C2C; }
.buyrow { display: flex; align-items: center; gap: 8px; padding: 6px 2px; border-bottom: 1px solid color-mix(in srgb, var(--outline) 40%, transparent); }
.buyrow input { width: 20px; height: 20px; }
.buyrow.bought span { text-decoration: line-through; color: var(--muted); }
.sticky { position: sticky; top: -8px; z-index: 3; margin: -8px -16px 0; padding: 8px 16px 6px; background: var(--bg); }
.bell { position: relative; width: 44px; height: 44px; border: 0; background: none; border-radius: 50%; cursor: pointer; display: grid; place-items: center; color: var(--fg); }
.bell svg { width: 24px; height: 24px; }
.badge { position: absolute; top: 4px; right: 2px; min-width: 18px; height: 18px; border-radius: 9px; background: #111; color: #fff; box-shadow: 0 0 0 2px var(--bg); font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }
.badge.urgent { background: var(--k-dead); color: #fff; }
.action .round { position: relative; }
.action .badge { top: -4px; right: -4px; min-width: 24px; height: 24px; border-radius: 12px; font-size: 13px; }

.upd .src { font-size: 11px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.upd .src b { color: var(--fg); font-weight: 500; }
.upd .quote { font-size: 13px; border-left: 3px solid var(--outline); padding-left: 8px; color: var(--muted); font-style: italic; }
.upd .prop { font-size: 14px; }
.upd .prop li { margin-left: -6px; }
.upd .btns { display: flex; gap: 6px; flex-wrap: wrap; }
.upd .btns .btn { padding: 7px 14px; }
.thread { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.thread > div { border-left: 3px solid var(--outline); padding: 2px 8px; color: var(--fg); }
.thread > div.me { border-left-color: var(--primary); color: var(--muted); }

.thread b { font-weight: 600; font-size: 11px; }
.pill.cc { background: var(--slate); }
.pill { font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; border-radius: 4px; padding: 1px 5px; background: var(--k-dead); color: #fff; }
.notice { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.notice.warn { border: 1px solid var(--k-dead); }
.k-TASK { color: var(--k-task); } .k-MEETING { color: var(--k-meet); } .k-DEADLINE { color: var(--k-dead); }
.done.k-TASK { color: var(--k-task-y); } .done.k-MEETING { color: var(--k-meet-y); } .done.k-DEADLINE { color: var(--k-dead-y); }
.strong span { font-weight: 500; }

.fabs { position: absolute; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; align-items: flex-end; touch-action: none; }
.fabs.dragging { opacity: .85; }
#i-text { min-height: 150px; }
.round { width: 64px; height: 64px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; color: #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.round svg { width: 29px; height: 29px; }
.round.navy { background: var(--navy); } .round.slate { background: var(--slate); } .round.bordeaux { background: var(--bordeaux); }
.round.pewter { background: var(--pewter); } .round.rec { background: var(--rec); } .round.yellow { background: var(--yellow); color: var(--ink); }
.action { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; }
.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 6px; justify-items: center; margin-top: 6px; }

/* Buttons and tags */
.btn { border: 0; background: var(--primary); color: var(--bg); border-radius: 20px; padding: 8px 16px; cursor: pointer; font-weight: 500; }
.btn.outline { background: transparent; color: var(--primary); border: 1px solid var(--outline); }
.text { border: 0; background: none; color: var(--primary); font-weight: 500; padding: 8px 10px; cursor: pointer; border-radius: 16px; }
.text.danger { color: var(--error); }
.tag { border: 1px solid color-mix(in srgb, var(--outline) 60%, transparent); background: var(--variant); border-radius: 7px;
  padding: 3px 10px; font-size: 12px; cursor: pointer; min-height: 28px; }
.tag { white-space: nowrap; }
.tags1 { display: flex; gap: 4px; width: 100%; }
.tags1 .tag { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; padding: 3px 2px; min-height: 34px; font-size: 12px; letter-spacing: -0.1px; }
.tag[aria-pressed="true"] { background: color-mix(in srgb, var(--primary) 18%, var(--surface)); border-color: transparent; font-weight: 500; }
.tag.kind-TASK { color: var(--k-task); } .tag.kind-MEETING { color: var(--k-meet); } .tag.kind-DEADLINE { color: var(--k-dead); }

/* Dialog */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; padding: 16px; z-index: 10; }
.dialog { background: var(--dialog); border-radius: 28px; width: min(88vw, 420px); max-height: 86vh; display: flex; flex-direction: column;
  padding: 22px 22px 12px; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.dialog h3 { font-size: 17px; font-weight: 500; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
.dialog .body { overflow-y: auto; display: flex; flex-direction: column; gap: 9px; padding: 2px; }
.dialog .foot { display: flex; justify-content: flex-end; gap: 4px; padding-top: 8px; }
.field { position: relative; display: block; flex: 1; min-width: 0; margin-top: 7px; }
.field > span { position: absolute; top: -7px; left: 9px; padding: 0 4px; font-size: 11px; line-height: 14px; color: var(--muted);
  background: var(--dialog); background: linear-gradient(var(--surface), var(--surface)); }
.field input, .field textarea { width: 100%; border: 1px solid var(--outline); border-radius: 6px; background: transparent; color: var(--fg);
  font: 14px var(--font); padding: 9px 12px; min-height: 38px; resize: vertical; }
.field input:focus, .field textarea:focus { outline: none; border: 1.5px solid var(--primary); }
.field:focus-within > span { color: var(--primary); }
.q { width: 24px; height: 28px; border: 0; background: none; border-radius: 50%; color: var(--muted); opacity: .55; font-weight: 300; font-size: 13px; cursor: pointer; flex: none; padding: 0; }
.q[aria-expanded="true"] { color: var(--primary); opacity: 1; }
.help { font-size: 12px; color: var(--muted); padding-right: 24px; }
.menu { border: 1px solid var(--outline); border-radius: 6px; background: var(--surface); max-height: 168px; overflow-y: auto; margin: 2px 24px 0 0; }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 12px; font-size: 13px; cursor: pointer; }
.menu button:hover, .menu button:focus-visible { background: var(--variant); }
.menu .create { color: var(--primary); font-weight: 500; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--outline); border-radius: 18px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 7px 8px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: color-mix(in srgb, var(--primary) 18%, var(--surface)); font-weight: 500; }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choices .btn { padding: 12px 16px; font-size: 15px; }
.steps { display: flex; flex-direction: column; gap: 2px; }
.step { display: grid; grid-template-columns: 24px 20px 1fr auto; align-items: center; gap: 4px; min-height: 32px; }
.step .tools2 { display: flex; }
.sday { display: flex; align-items: center; gap: 4px; padding-left: 48px; font-size: 11px; color: var(--bar); margin: -2px 0 4px; }
.sday label { position: relative; cursor: pointer; padding: 2px 0; }
.sday label.late { color: var(--k-dead); }
.sday input[type=date] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.sday .text { font-size: 11px; padding: 2px 6px; }
.step .n { font-size: 12px; color: var(--muted); text-align: right; }
.step.done span:last-of-type { color: var(--muted); text-decoration: line-through; }
.step input { border: 1px solid var(--primary); border-radius: 6px; background: transparent; color: var(--fg); font: 13px var(--font); padding: 6px 8px; width: 100%; }
.icon { width: 28px; height: 28px; border: 0; background: none; border-radius: 50%; color: var(--muted); cursor: pointer; display: grid; place-items: center; padding: 0; font-size: 16px; }
.icon svg { width: 16px; height: 16px; }
.field input[type="date"] { min-height: 38px; }
.glabel { font-size: 11px; color: var(--muted); padding-left: 4px; }
.fieldrow { display: flex; align-items: flex-end; gap: 0; }
.err { color: var(--error); font-size: 13px; }

/* Assistant */
.chat { display: flex; flex-direction: column; gap: 6px; padding-bottom: 8px; }
.bubble { max-width: 84%; border-radius: 12px; padding: 9px 11px; white-space: pre-wrap; word-break: break-word; }
.bubble.me { align-self: flex-end; background: var(--primary); color: var(--bg); }
.bubble.ai { align-self: flex-start; background: var(--variant); }
.bubble .tools { font-size: 11px; color: var(--muted); margin-top: 4px; }
.composer { display: flex; gap: 8px; align-items: flex-end; padding: 8px 16px; border-top: 1px solid var(--outline); }
.composer textarea { flex: 1; border: 1px solid var(--outline); border-radius: 8px; background: var(--surface); color: var(--fg);
  font: 14px var(--font); padding: 10px 12px; resize: none; min-height: 44px; max-height: 120px; }
.composer .round { width: 48px; height: 48px; } .composer .round svg { width: 22px; height: 22px; }
.progress { height: 3px; background: linear-gradient(90deg, transparent, var(--primary), transparent); background-size: 50% 100%;
  animation: slide 1.2s linear infinite; background-repeat: no-repeat; }
@keyframes slide { from { background-position: -50% 0 } to { background-position: 150% 0 } }
@media (prefers-reduced-motion: reduce) { .progress { animation: none; background: var(--primary); } }
.confirm { border: 1px solid var(--outline); }
.confirm ul { margin: 6px 0; padding-left: 18px; }

/* About me */
.presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.eq { display: flex; gap: 10px; overflow-x: auto; padding: 10px 2px 4px; }
.band { flex: none; width: 66px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
.lv { display: flex; flex-direction: column; gap: 3px; width: 36px; }
.lvb { height: 22px; border: 0; border-radius: 4px; background: var(--variant); cursor: pointer; padding: 0; }
.lvb.on { background: var(--primary); }
.bname { border: 0; background: none; font-size: 12px; line-height: 1.2; text-align: center; cursor: pointer; padding: 2px; word-break: break-word; min-height: 30px; }
.bmin { font-size: 11px; color: var(--muted); min-height: 14px; }
.addband { width: 36px; height: 72px; border: 1.5px dashed var(--outline); border-radius: 6px; background: none; color: var(--muted); font-size: 20px; cursor: pointer; }
.dots { border: 0; background: none; font-size: 18px; color: var(--primary); cursor: pointer; letter-spacing: 1px; }
.chipx { border: 0; background: var(--variant); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 13px; }
.rule { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; }
.switch { appearance: none; width: 44px; height: 26px; border-radius: 13px; background: var(--outline); position: relative; cursor: pointer; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); transition: left .15s; }
.switch:checked { background: var(--primary); } .switch:checked::after { left: 21px; }
.setting { display: flex; gap: 12px; align-items: center; padding: 6px 0; }
.banner { font-size: 12px; background: var(--variant); color: var(--muted); padding: 6px 16px; text-align: center; }
</style>

<div class="app" id="app">
  <div class="banner">Preview · example data, kept in this browser · <button class="text" id="reset" style="padding:0 4px">Reset</button></div>

  <div id="fabs"></div>

</div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const dow = s => { const w = parse(s).getDay(); return w === 0 ? 7 : w; }; // 1 = Monday
const TODAY = iso(new Date());
const validDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s) && iso(parse(s)) === s;
const DAY_EN = ["M", "Tu", "W", "Th", "F", "Sa", "Su"], DAY_FR = ["L", "Ma", "Me", "J", "V", "S", "D"];
const DAY_NAME = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const PRIO = { LOW: 1, NORMAL: 2, HIGH: 3, CRITICAL: 4 };

function label(d, lang) { return (lang === "fr" ? DAY_FR : DAY_EN)[dow(d) - 1] + parse(d).getDate(); }

const toMin = hm => { const [h, m] = hm.split(":").map(Number); return h * 60 + m; };
const hm = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
/** Meeting times that fit the day, not just the calendar (same rules as the app). */
function findSlots(s, from, days, count, duration) {
  const m = s.meetings, wins = m.windows.map(w => w.split(/[-–]/).map(x => toMin(x.trim()))).filter(w => w.length === 2 && w[1] > w[0]);
  const search = strict => {
    const found = [];
    for (let i = 0; i < days && found.length < count; i++) {
      const d = addDays(from, i); if (d < TODAY || !m.days.includes(dow(d))) continue;
      const cells = cellsOn(s, d).filter(c => !c.st.outcome);
      if (cells.length >= 5) continue;
      if (cells.filter(c => effOf(c.t, c.st) === "HEAVY" && !c.st.done).length >= 2) continue;
      if (strict && [...cells, ...cellsOn(s, addDays(d, 1))].some(c => kindOf(c.t, c.st) === "DEADLINE" && !c.st.done)) continue;
      const busy = s.calendar.filter(e => e.date === d).map(e => e.allDay ? [0, 24 * 60] : [toMin(e.start), toMin(e.end)]);
      if (Math.max(busy.length, cells.filter(c => kindOf(c.t, c.st) === "MEETING").length) >= m.maxPerDay) continue;
      const earliestM = d === TODAY ? new Date().getHours() * 60 + 120 : 0;
      const pref = found.length % wins.length, orderW = [wins[pref], ...wins.filter((_, k) => k !== pref)];
      let slot = null;
      for (const [o, c] of orderW) { for (let st = o; st + duration <= c && !slot; st += 30) {
        if (st < earliestM) continue;
        if (!busy.some(([b, e]) => st < e + m.buffer && st + duration > b - m.buffer)) slot = { date: d, start: hm(st), end: hm(st + duration) };
      } if (slot) break; }
      if (slot) found.push(slot);
    }

  };

  return [...strict, ...relaxed].sort((a, b) => a.date < b.date ? -1 : 1).slice(0, count);
}

/** The round buttons float: drag them anywhere so they never hide what you're reading. The place is remembered. */
let fabPos = (() => { try { return JSON.parse(localStorage.getItem("docket5-fab")) || { x: 0, y: 0 }; } catch (e) { return { x: 0, y: 0 }; } })(), fabDragged = false;
function floatFabs() {
  const el = document.querySelector("#fabs .fabs"); if (!el) return;
  const clamp = () => {
    const r = el.getBoundingClientRect(), dx = r.left - fabPos.x, dy = r.top - fabPos.y; // where it sits with no offset
    fabPos.x = Math.min(Math.max(fabPos.x, 8 - dx), innerWidth - 8 - (dx + r.width));
    fabPos.y = Math.min(Math.max(fabPos.y, 8 - dy), innerHeight - 8 - (dy + r.height));
  };
  const place = () => { el.style.transform = `translate(${fabPos.x}px, ${fabPos.y}px)`; };
  place(); clamp(); place();
  let start = null;
  el.addEventListener("pointerdown", e => { start = { px: e.clientX, py: e.clientY, x: fabPos.x, y: fabPos.y, moved: false }; });
  el.addEventListener("pointermove", e => {
    if (!start) return;
    const mx = e.clientX - start.px, my = e.clientY - start.py;
    if (!start.moved && Math.hypot(mx, my) < 8) return;
    if (!start.moved) { start.moved = true; el.setPointerCapture(e.pointerId); el.classList.add("dragging"); }
    fabPos.x = start.x + mx; fabPos.y = start.y + my; clamp(); place();
  });
  const end = () => {
    if (start && start.moved) { fabDragged = true; el.classList.remove("dragging"); try { localStorage.setItem("docket5-fab", JSON.stringify(fabPos)); } catch (x) { } setTimeout(() => fabDragged = false, 50); }
    start = null;
  };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
}

/* ---------- To buy: one list for home and work; a trip becomes one Errands cell ---------- */
/** True when the list is worth a trip: 5 things or more, or one needed within 2 days, and no trip planned yet. */
function buyDue() {
  const open = S.buy.filter(x => !x.done && !x.errand);
  return open.length >= 5 || open.some(x => x.needBy && x.needBy <= addDays(TODAY, 2));
}
function addToBuy(texts, work, needBy) {
  const added = [];
  for (const raw of texts) {
    const text = String(raw).trim(); if (!text) continue;
    if (S.buy.some(x => !x.done && x.text.toLowerCase() === text.toLowerCase())) continue;
    S.buy.push({ id: uid(), text, work: !!work, needBy: needBy || null, done: false, errand: null }); added.push(text);
  }

}
/** One Errands cell for everything still to buy, on the first free day (or [day]). */
function planErrands(day) {
  const items = S.buy.filter(x => !x.done && !x.errand); if (!items.length) return null;
  const t = newTask(S, { title: `Errands · ${items.length} ${items.length > 1 ? "things" : "thing"}`, desc: "To buy: " + items.map(x => x.text).join(", ") + ".", effort: "LIGHT" });
  t.errands = true;
  items.forEach(x => x.errand = t.id);
  const soon = items.map(x => x.needBy).filter(Boolean).sort()[0];
  if (day || soon) pin(S, t, day || (soon > TODAY ? addDays(soon, -1) > TODAY ? addDays(soon, -1) : TODAY : TODAY), lastAdded[0]);

/** The cart's mic: hear what the user needs, let the AI split it into items (home or work, by when), add them. */
function talkToBuy(btn, redraw) {
  const out = $("#buy-heard");
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  const understand = async heard => {
    out.textContent = `“${heard}” · sorting it…`;
    const sample = await samplePromise;
    let items = null;
    if (sample) {
      try {
        const r = await sample.json(`The user is adding to their shopping list. Today is ${TODAY}. They said:
"""${heard}"""
Reply with only {"items":[{"text": string, "work": boolean, "needed_by": string}]}: one entry per thing to buy, short (e.g. "Printer toner", "Lait 2 L"), in their language; work=true for office or client things; needed_by = YYYY-MM-DD only if they said when, else "".`, { cache: false });
        items = Array.isArray(r.items) ? r.items : null;
      } catch (e) { items = null; }
    }
    // Without the AI: split on commas and "and"/"et".
    items ||= heard.split(/,|;| and | et /i).map(t => ({ text: t.trim(), work: false, needed_by: "" }));
    const added = [];
    items.forEach(x => added.push(...addToBuy([x.text], x.work, validDate(String(x.needed_by || "")) ? x.needed_by : null)));
    save(); redraw(); render();

  if (!Rec) {

    const v = $("#buy-in").value.trim();
    if (v) return understand(v);
    out.textContent = "Speech isn't available here: type it in the box below, then tap the mic again.";
    return $("#buy-in").focus();
  }
  const rec = new Rec(); rec.lang = navigator.language || "en-CA"; rec.interimResults = true;
  btn.classList.add("rec"); out.textContent = "Listening…";

  rec.onerror = () => { out.textContent = "I couldn't hear you. Tap the mic to try again, or type it."; };
  rec.onend = () => { btn.classList.remove("rec"); if (text.trim()) understand(text.trim()); };
  rec.start();
}

/* ---------- Calendar events: you choose which ones take cells in your day ---------- */
const calKey = e => `${e.date}|${e.start || "all"}|${e.title}`;
/** About 1.5 h per cell: up to 2 h is one cell, a half-day two, an all-day event the whole day. */
const calCells = e => e.allDay ? 5 : Math.min(5, Math.max(1, Math.ceil((toMin(e.end) - toMin(e.start) - 30) / 90)));
const calWhen = e => e.allDay ? "all day" : `${e.start}–${e.end}`;
function calBadge(d) {
  const evs = (S.calendar || []).filter(e => e.date === d), open = evs.filter(e => !(S.calDecisions || {})[calKey(e)]).length;
  const cls = !evs.length ? "" : open ? "todo" : "ok";

/** Step-by-step list: + in front of a step adds one above it, the pencil changes it, − removes it.

         <span class="tools2"><button type="button" class="icon" data-s="edit" data-i="${i}" aria-label="Change this step">${ICON.edit}</button><button type="button" class="icon" data-s="del" data-i="${i}" aria-label="Remove this step">${ICON.minus}</button></span></div>`) + dayLine(i)).join("")}

const dayName = d => `${DAY_NAME[dow(d) - 1]} ${parse(d).getDate()}`;
/** Applies a change to a copy first. For a project, shows the new end date; if it would miss the deadline, asks first. */
/** Applies a change to a cell. For a project step, warns first only when the change makes the project end later
 *  than now AND too close to (or after) its deadline. [check] false (Done, To do): those never delay anything. */
function withImpact(t, change, doneText, check = true) {
  if (!t.project) { change(S); plan(S); if (doneText) S.notice = { text: doneText, warn: false }; close(); return render(); }
  const before = projectEnd(S, t.project);
  const trial = JSON.parse(JSON.stringify(S));
  change(trial); plan(trial);
  const after = projectEnd(trial, t.project);
  const text = !after.open ? `${t.project} is finished.` : `${t.project} now ends ${after.end ? dayName(after.end) : "later (no free cell yet)"}${after.deadline ? ` (deadline ${dayName(after.deadline)})` : ""}.`;
  const quiet = doneText == null && after.open > 0;
  const apply = () => { change(S); plan(S); if (!quiet) S.notice = { text: (doneText ? doneText + " " : "") + text, warn: after.late }; close(); render(); };
  const worse = !after.end ? after.open > 0 && !!before.end : !!before.end && after.end > before.end;
  if (!check || !after.late || !worse) return apply();
  const why = !after.end ? `would have a step with no free cell before its deadline (${dayName(after.deadline)})`
    : after.end > after.deadline ? `would end ${dayName(after.end)}, after its deadline (${dayName(after.deadline)})`
    : `would end ${dayName(after.end)}, on its deadline day (${dayName(after.deadline)}), with no margin left`;
  dialog(`<h3>Deadline at risk</h3><div class="body"><div>${esc(t.project)} ${why}.</div>
    <div class="choices"><button class="btn" data-a="go">Do it anyway</button><button class="btn outline" data-a="ask">Ask the assistant for options</button></div></div>
    <div class="foot"><button class="text" data-a="close">Cancel</button></div>`, host => {
    host.querySelector("[data-a=go]").addEventListener("click", apply);
    host.querySelector("[data-a=ask]").addEventListener("click", () => { close(); goAssistant(`${t.project} would end after its deadline (${after.deadline}) if I push or cancel a step. Propose options.`, true); });
    host.querySelector("[data-a=close]").addEventListener("click", close);
  });
}

/** Saves a project with its steps as edited in the form: chosen days first, then the planner, then room before the deadline. */
function saveProjectWithSteps(proj, oldName, steps) {

  saveProject(S, proj, oldName);
  const list = steps.filter(x => x.done || x.title.trim());
  applyProjectSteps(proj.name, proj.notes, list, holder, keepTitle);
  const h = projectTask(S, proj.name);
  if (h) { const open = h.steps.filter(x => !x.done && !x.outcome); list.filter(x => !x.done).forEach((x, k) => { if (x.date && open[k] && open[k].date !== x.date) pinStepTo(S, open[k], x.date); }); }

/** Writes the edited step list back to the project's own task. Done, pushed and cancelled cells stay;
 *  open steps follow the new list and order, and are placed again by the planner. */
function applyProjectSteps(name, notes, list, holder, oldTitle) {
  let t = holder && S.tasks.includes(holder) ? holder : null;
  const open = list.filter(x => !x.done);
  if (!t && !open.length) return;
  if (!t) { t = newTask(S, { title: name, project: name, steps: ["x"] }); t.steps = []; }
  if (t.title === oldTitle) t.title = name;
  t.desc = notes || t.desc;
  const closed = t.steps.filter(x => x.done || x.outcome);
  const reopened = open.map(x => {
    const old = x.id && t.steps.find(s => s.id === x.id);
    if (old) { old.title = x.title.trim(); if (!old.pinned) { old.date = null; old.slot = null; } return old; }
    return { id: uid(), title: x.title.trim(), done: false, date: null, slot: null, pinned: false, outcome: null, notBefore: null };
  });
  t.steps = [...closed, ...reopened];
  if (!t.steps.length) S.tasks = S.tasks.filter(x => x !== t);
  const pr = findProject(S, name); if (pr && t.desc !== undefined) t.desc = pr.notes || t.desc;
}

/** For the AI: how much time and how many free cells are left before a deadline. */
function timeLeft(deadline) {

  return { done, total, pct: total ? Math.round(done / total * 100) : 0, start, end: e.end, late: e.late, deadline: p.deadline, next, open: e.open,

}

const LAST_HOUR_TODAY = 14; // after this hour nothing new lands today
const KINDS = { task: "Task", step: "Step", quick: "Quick things", idea: "Idea", buy: "To buy", drop: "Drop" };
function listPrompt() {
  return `You organize a Docket 5 user's brain dump. Their table, projects and values:
${describe()}

${S.list.map((x, i) => `${i + 1}. ${x.text}`).join("\n")}

- "step": it belongs to an existing project (give "project" exactly as named above).
- "task": one focused piece of work, about 1.5 h or less. If it is something they put off, make "title" a small concrete first step.
- "quick": a 5 to 15 minute thing (a call, a short email, a form); several are grouped into one cell.
- "idea": vague or someday. "buy": something to buy. "drop": not worth doing (be honest but rare).
Order "rank" by importance: deadlines, what blocks a project, then their values. "due" only when a date is said (YYYY-MM-DD).
Reply with only {"items":[{"line":1,"kind":"task","title":"...","project":"","rank":1,"due":""}]}`;

function heuristicSort() {
  const buy = S.settings.buyWords || BUY_WORDS;
  return S.list.map((x, i) => ({ line: i + 1, kind: buy.some(w => x.text.toLowerCase().includes(w)) ? "buy" : /^(call|appeler|email|écrire|send|envoyer)\b/i.test(x.text) ? "quick" : "task", title: x.text, project: "", rank: i + 1, due: "" }));
}
/** Places the sorted items on a state (the real one, or a copy to show the result first). */
function placeList(x, items) {
  // Free cells only (nothing planned moves); today too if there is still time.
  const start = new Date().getHours() < LAST_HOUR_TODAY ? TODAY : addDays(TODAY, 1), quick = [];
  items.slice().sort((a, b) => (a.rank || 99) - (b.rank || 99)).forEach(it => {
    const nb = start;
    if (it.kind === "buy") return x.buy.push({ id: uid(), text: it.title, work: false, needBy: it.due || null, done: false, errand: null });
    if (it.kind === "idea") return x.projects.push({ name: uniqueProjectName(x, it.title), priority: "NORMAL", deadline: null, notes: it.title, values: [], blocks: [] });
    if (it.kind === "drop") return;
    if (it.kind === "quick") return quick.push(it.title);
    const project = it.kind === "step" && findProject(x, it.project) ? findProject(x, it.project).name : "";
    newTask(x, { title: it.title, project, deadline: it.due || null }); lastAdded.forEach(st => st.notBefore = nb); it.ids = lastAdded.map(st => st.id);
  });
  for (let i = 0; i < quick.length; i += 6) {
    const batch = quick.slice(i, i + 6);
    newTask(x, { title: `Quick things (${batch.length})`, desc: batch.map(t => "• " + t).join("\n"), effort: "LIGHT" }); lastAdded.forEach(st => st.notBefore = start);
  }
  plan(x);
}
async function sortList() {
  if (!S.list.length) return;
  dialog(`<h3>Organizing your list…</h3><div class="body"><div class="small">Reading it with your projects, values and calendar.</div></div>`, () => {});
  let items = null;
  const sample = await samplePromise;
  if (sample) { try { const out = await sample.json(listPrompt(), { cache: false }); items = (out.items || []).map(it => ({ ...it, title: String(it.title || S.list[it.line - 1]?.text || "") })); } catch (e) { items = null; } }

}
function showSorted(items) {
  const x = JSON.parse(JSON.stringify(S)); placeList(x, items);
  const dayOf = it => { if (!it.ids) return ""; for (const t of x.tasks) for (const st of t.steps) if (st.id === it.ids[0]) return st.date ? dayName(st.date) : "when a cell frees up"; return ""; };

  const count = k => items.filter(i => i.kind === k).length;
  const last = x.tasks.flatMap(t => t.steps).filter(st => st.date && !S.tasks.some(t => t.steps.some(o => o.id === st.id))).map(st => st.date).sort().pop();
  dialog(`<h3>Organized</h3><div class="body">
    <div class="small"><b>${items.length} things →</b> ${Object.keys(KINDS).filter(k => count(k)).map(k => { const n = count(k), w = KINDS[k].toLowerCase(); return `${n} ${n > 1 && (k === "task" || k === "step" || k === "idea") ? w + "s" : w}`; }).join(" · ")}${last ? `. The last one lands <b>${dayName(last)}</b>.` : "."}</div>
    <div class="small">Only free cells are used, around your calendar: nothing already planned moves. Work stays Monday to Friday.</div>
    <div style="display:flex;flex-direction:column;gap:6px">${items.slice().sort((a, b) => (a.rank || 99) - (b.rank || 99)).map(it => `<div class="card" style="padding:6px 10px">

      <div class="small"><b>${KINDS[it.kind] || "Task"}</b>${it.kind === "step" && it.project ? " in " + esc(it.project) : ""}${it.kind === "quick" && quickDay ? " · " + quickDay : dayOf(it) ? " · " + dayOf(it) : ""}${it.due ? " · due " + dayName(it.due) : ""}</div></div>`).join("")}</div></div>
    <div class="foot"><button class="text" data-l="talk">Talk about it</button><button class="btn" data-l="place">Place them</button></div>`, host => {
    host.querySelector("[data-l=place]").addEventListener("click", () => { placeList(S, items); S.list = []; S.notice = { text: `What was on your mind is in your table${last ? ", until " + dayName(last) : ""}.`, warn: false }; save(); close(); render(); });

}

  if (step === 2) return dialog(`${head}<div class="body">
      <div><strong>Get your ${P.name} key</strong> <span class="small">on ${P.site}</span></div>
      <ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px">${P.steps.map(x => `<li>${x}</li>`).join("")}</ol>

        ${P.asks.map(([q, a]) => `<div class="small"><b>${q}:</b> ${a}</div>`).join("")}
        <div class="small">${P.tip}</div></div>
      <a class="btn" href="${P.keys}" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">Open the ${P.company} page</a>
      <div class="small">Then come back here: the key will be waiting in your clipboard.</div></div>
      <div class="foot"><button class="text" data-a="back">Back</button><button class="text" data-a="next">I copied it</button></div>`, host => {
      host.querySelector("[data-a=back]").addEventListener("click", () => aiWizard(1));

    });

      <div><strong>Paste and test</strong></div>

      <div id="ai-result" class="small"></div></div>
      <div class="foot"><button class="text" data-a="back">Back</button><button class="text" data-a="save" disabled>Save</button></div>`, host => {
    const out = $("#ai-result"), save = host.querySelector("[data-a=save]");
    let ok = false;
    host.querySelector("[data-a=back]").addEventListener("click", () => aiWizard(2, provider));
    host.querySelector("[data-a=paste]").addEventListener("click", () => {
      out.textContent = "In the app, this puts the copied key in the box. In the preview, paste it yourself.";
      $("#ai-key").focus();
    });
    $("#ai-key").addEventListener("input", () => { ok = false; save.disabled = true; out.textContent = ""; });
    host.querySelector("[data-a=test]").addEventListener("click", () => {
      const k = $("#ai-key").value.trim();
      // Plain-words results, as the app gives them after a tiny test call.
      if (!k) { out.style.color = "var(--error)"; return out.textContent = "The box is empty. Tap Paste, or long-press the box and choose Paste."; }
      if (!k.startsWith(P.prefix)) { out.style.color = "var(--error)"; return out.textContent = `This doesn't look like a ${P.name} key. It should start with ${P.prefix}. Copy it again from ${P.site}.`; }
      if (k.length < 12) { out.style.color = "var(--error)"; return out.textContent = "The key looks cut off. Copy the whole line again."; }
      ok = true; save.disabled = false; out.style.color = "var(--fg)";

    });
    save.addEventListener("click", () => {
      if (!ok) return;
      const k = $("#ai-key").value.trim();
      S.ai = { provider, last4: k.slice(-4) }; // the key itself is never kept in the preview
      close(); render();
    });
  });
}

function describe() {
  const L = [];
  L.push("TABLE (day | 5 cells, [x]=done, [ ]=to do, [>]=pushed, [-]=cancelled, · = free)");
  for (const r of rows(S, TODAY, 14)) L.push(`${label(r.date, "en")} ${r.date} | ` + r.cells.map(c => c ? `[${c.st.done ? "x" : c.st.outcome === "PUSHED" ? ">" : c.st.outcome ? "-" : " "}] ${cellTitle(c.t, c.st)} (step ${c.st.id})` : "·").join(" | "));
  if (S.values.length) { L.push("", "VALUES (what matters to the user, weight 1-3)"); S.values.forEach(v => L.push(`- ${v.name} weight=${v.weight}${v.min ? " min_per_week=" + v.min : ""}${v.meaning ? ": " + v.meaning : ""}`));
    const g = gaps(S); if (g.length) L.push("BALANCE this week, below minimum: " + g.map(x => `${x.v.name} ${x.n}/${x.v.min}`).join(", ")); }
  if (S.about.easy.length || S.about.hard.length) { L.push("", "ABOUT THE USER"); if (S.about.easy.length) L.push("- easy or enjoyable for them: " + S.about.easy.join(", ")); if (S.about.hard.length) L.push("- they tend to put off: " + S.about.hard.join(", ")); }
  if (S.projects.length) { L.push("", "PROJECTS (steps in order; [x] done)"); S.projects.forEach(p => {
    if (isIdea(S, p)) return L.push(`- ${p.name} IDEA (parked, not started, no cells)${p.notes ? ": " + p.notes : ""}`);
    const h = projectTask(S, p.name), e = projectEnd(S, p.name);
    const st2 = projectStats(S, p);
    L.push(`- ${p.name} ${st2.pct}% done (${st2.done}/${st2.total}) priority=${p.priority}${p.deadline ? " deadline=" + p.deadline : ""}${(p.blocks || []).length ? " unlocks=" + p.blocks.join("/") : ""}${p.values && p.values.length ? " values=" + p.values.join("/") : ""}${e.end ? " ends=" + e.end : ""}${e.late ? " LATE" : ""}${p.notes ? " notes: " + p.notes : ""}`);
    if (h) h.steps.filter(x => !x.outcome).forEach((x, k) => L.push(`    ${k + 1}. [${x.done ? "x" : " "}] ${x.title}${x.date ? " on " + x.date : ""}${kindOf(h, x) !== "TASK" ? " " + kindOf(h, x).toLowerCase() : ""}${effOf(h, x) !== "NORMAL" ? " effort=" + effOf(h, x).toLowerCase() : ""} (step ${x.id})`));
  }); }
  const open = S.tasks.filter(t => !t.project && t.steps.some(x => !x.done && !x.outcome));
  if (open.length) { L.push("", "ONE-CELL TASKS"); open.forEach(t => L.push(`- ${t.id}: ${t.title}${t.project ? ` [${t.project}]` : ""} priority=${t.priority}${t.kind !== "TASK" ? " " + t.kind.toLowerCase() : ""}${t.effort !== "NORMAL" ? " effort=" + t.effort.toLowerCase() : ""}${t.pushes ? ` pushed ${t.pushes}x` : ""}${t.deadline ? " deadline=" + t.deadline : ""}${t.values.length ? " values=" + t.values.join("/") : ""}\n    explanation: ${t.desc}`)); }
  const toBuy = S.buy.filter(x => !x.done);
  if (toBuy.length) L.push("", "TO BUY (not on the table): " + toBuy.map(x => x.text + (x.work ? " [work]" : "") + (x.needBy ? " by " + x.needBy : "") + (x.errand ? " [in an Errands cell]" : "")).join("; "));
  if (S.calendar.length) { L.push("", "CALENDAR"); S.calendar.forEach(e => L.push(`- ${e.date} ${calWhen(e)}: ${e.title}${(S.calDecisions || {})[calKey(e)] ? ((S.calDecisions[calKey(e)].add ? " (in the table)" : " (left out by the user)")) : " (not decided yet)"}`)); }
  return L.join("\n");
}

function systemPrompt() {
  const d = new Date();
  return `You are the Docket 5 assistant, a planning assistant for legal professionals and business people who juggle many matters and personal obligations. Many of them get scattered easily or have ADD, so keep things simple and concrete.
Their whole method is a table: one line per day, five cells per day, one task per cell. A cell turns yellow when done. Five is the limit.
You manage that table with your tools. The planner places cells for you and enforces the 5-per-day limit; you decide what the tasks are, how to split them into steps, and what they serve. Never invent task or step ids.
Today is ${d.toLocaleDateString("en", { weekday: "long" })} ${TODAY}. The planner fills Monday to Friday.
Every task has an explanation (description); always write a clear one.
TO BUY: things to buy never take a cell each. When the user mentions buying something, or uses one of their shopping words (${S.settings.buyWords.join(", ")}), call add_to_buy (home or work; needed_by only if they said when). When the list is worth a trip (5 things, or one needed soon), offer once to plan_errands: one Errands cell for the whole list.
TENANT AND REPAIR REQUESTS: a tenant's request (leak, broken appliance, noise, heating...) is a project named "Building · Unit · Issue" (e.g. "12 Main · Apt 3 · Leak"); put the tenant's name, phone and access details in its notes. Steps: reply to the tenant (today, within 24 hours) → visit and diagnose → get 2 quotes (if a contractor is needed) → book the contractor → confirm with the tenant that it is fixed. A tiny fix (a bulb, a battery) is one task, not a project. The first reply to the tenant is always the most urgent step: it protects the landlord's reputation.
A FULL DAY: when the user wants something on a day (often today) that is full, the day matters to them. Never just refuse or pick another day: call move_step; when it says the day is full, propose in one short question which cell moves later (the least important by priority, values and deadlines; never a meeting or deadline unless they say so), and where it goes. When they agree or name another, finish it with move_step make_room_with. SWAPS: when they ask to swap or exchange two cells, use swap_cells so both move at once; never leave a swap half done. After any move, say in one line where each moved cell is now.
TWO LEVELS ONLY, to keep things simple: a TASK is one cell (blue). Anything that needs several cells in an order is a PROJECT of steps (green); never make a task with sub-steps. Priority and deadline belong to projects. When the user describes something with several steps, agree on priority, deadline and steps, save_project, then add_task with that project and steps (they are appended in order). A project that must be done before another one "unlocks" it (save_project blocks) and takes its importance. Mark meetings with kind=meeting and deliveries or filings due that day with kind=deadline.
VALUES AND EFFORT: weigh the user's values in every choice and name the value at stake when you explain a trade-off. Tag tasks and projects with the values they serve. Set each task's effort as it will feel to THIS user. At most 2 heavy cells a day. For a heavy task make the first step tiny and easy to start, and follow heavy work with something easy or enjoyable. When a task was pushed twice or more, ask ONE short question: split it, smaller first step, or hand it off? When a value is below its weekly minimum, suggest one concrete thing for it.
LEARNING ABOUT THE USER: never run a questionnaire. When a message starts with "ABOUT ME:", turn it into set_value and set_about calls.
MEETINGS: to find a time for someone, call find_slots, then draft_message with 2 or 3 of the times in the recipient's language. When the person accepts, book_meeting.
When a message starts with "For <day> <date>:", put what they describe on that day with add_task on_day.
Answer in the language of the user's latest message (English or French).
RULES, in priority order:
${S.rules.filter(r => r.on).map((r, i) => `${i + 1}. ${r.text}`).join("\n")}
UNDERSTANDING BEFORE ACTING: if something that matters is unclear, ask ONE short question and wait.${S.settings.confirm ? " Changes you make are STAGED (the tool result says so). After staging, say in one or two short sentences what will change and ask for confirmation. The app applies them when the user says yes." : ""}
${S.memory.length ? "WHAT YOU KNOW ABOUT THE USER:\n" + S.memory.map(m => "- " + m).join("\n") : ""}
Keep answers short: at most 5 lines, no markdown tables.`;
}

const kinds = ["task", "meeting", "deadline"], efforts = ["light", "normal", "heavy"];
const TOOLS = [
  { name: "add_task", write: true, description: "Add a one-cell task, or with project (and optionally steps) append steps to that project in order. Work bigger than one focused block of a few hours is a project. The planner places the cells. Returns the cells.",

function summary(name, i) {
  const task = id => (S.tasks.find(t => t.id === id) || {}).title, step = id => { const f = findStep(S, id); return f && cellTitle(f.t, f.st); };
  switch (name) {
    case "add_task": return `add "${i.title}"${(i.steps || []).length > 1 ? ` in ${i.steps.length} steps` : ""}${i.fixed_date || i.on_day ? " on " + (i.fixed_date || i.on_day) : ""}${i.project ? ` (${i.project})` : ""}`;
    case "set_step_status": return ({ done: "mark", todo: "reopen", pushed: "push", cancelled: "cancel" }[i.status] || i.status) + ` "${step(i.step_id)}"${i.status === "done" ? " done" : ""}`;
    case "update_task": return `change "${task(i.task_id)}"`;
    case "delete_task": return `delete "${task(i.task_id)}" and all its cells`;
    case "add_to_buy": return `add to the To buy list: ${(i.items || []).join(", ")}${i.for_work ? " (work)" : ""}`;
    case "plan_errands": return `plan one Errands cell${i.date ? " on " + i.date : ""} for the things to buy`;
    case "move_step": return `move "${step(i.step_id)}" to ${i.date}${i.make_room_with ? ` and move "${step(i.make_room_with)}" later` : i.make_room ? " (a less important cell moves later if the day is full)" : ""}`;
    case "swap_cells": return `swap "${step(i.step_a)}" and "${step(i.step_b)}"`;
    case "save_project": return `save the project "${i.name}"${i.priority ? ", " + String(i.priority).toLowerCase() + " priority" : ""}${i.deadline ? ", due " + i.deadline : ""}`;
    case "set_value": return i.remove ? `remove the value "${i.name}"` : `set the value "${i.name}"${i.weight ? ", weight " + i.weight : ""}${i.min_per_week ? `, at least ${i.min_per_week} a week` : ""}`;
    case "set_about": return `remember${i.easy ? " easy for you: " + i.easy.join(", ") : ""}${i.hard ? "; you put off: " + i.hard.join(", ") : ""}`;
    case "add_rule": return `add the rule "${i.text}"`;
    case "book_meeting": return `book "${i.title}" on ${i.date} at ${i.start}${i.with ? " with " + i.with : ""}`;
  }
  return name;
}
function check(name, i) {
  if (["set_step_status"].includes(name) && !findStep(S, String(i.step_id))) throw new Error("Unknown step " + i.step_id);
  if (["update_task", "delete_task"].includes(name) && !S.tasks.some(t => t.id === String(i.task_id))) throw new Error("Unknown task " + i.task_id);
  for (const k of ["deadline", "fixed_date", "on_day", "date", "from"]) if (i[k] && !validDate(String(i[k]))) throw new Error(`${k} must be an ISO date like 2026-10-15`);
}
function run(name, i) {
  const up = x => String(x || "").toUpperCase();
  switch (name) {
    case "add_task": {
      const t = newTask(S, { title: i.title, desc: i.description, project: i.project, kind: kinds.includes(i.kind) ? up(i.kind) : "TASK", effort: efforts.includes(i.effort) ? up(i.effort) : "NORMAL",
        values: i.values || [], deadline: i.deadline, fixedDate: i.fixed_date, steps: i.steps || [] });
      const added = lastAdded;
      let placed = true; if (i.on_day) placed = pin(S, t, i.on_day, added[0]); plan(S);
      return (placed ? "" : `${i.on_day} is full, so it went to the next free day. `) + (t.project ? `Added to the project "${t.project}". ` : `Added the task "${t.title}" (id ${t.id}). `) +
        "Cells: " + added.map(x => `${x.title} on ${x.date || "not placed"} (step ${x.id})`).join("; ");
    }
    case "add_to_buy": { const added = addToBuy(i.items || [], i.for_work, i.needed_by); return added.length ? `On the To buy list: ${added.join(", ")}. ${buyDue() ? "The list is now worth a trip: offer plan_errands." : ""}` : "Already on the list."; }
    case "plan_errands": { const t = planErrands(i.date); return t ? `Errands cell on ${t.steps[0].date}: ${t.desc}` : "Nothing to buy."; }
    case "move_step": {
      const f = findStep(S, String(i.step_id)); if (!f) throw new Error("Unknown step " + i.step_id);
      const d = String(i.date), on = S.tasks.flatMap(t => t.steps.filter(x => x.date === d && x.slot != null && x !== f.st).map(x => ({ t, x })));
      const used = new Set(on.map(c => c.x.slot)), free = [0, 1, 2, 3, 4].find(n => !used.has(n));
      if (free != null) { Object.assign(f.st, { date: d, slot: free, pinned: true, notBefore: null }); plan(S); return `Moved to ${d}.`; }
      const movable = on.filter(c => !c.x.done && !c.x.outcome && !c.x.pinned && kindOf(c.t, c.x) === "TASK" && !fixedOf(c.t, c.x) && c.t !== f.t).sort((a, b) => urgency(S, a.t) - urgency(S, b.t));
      if (!i.make_room && !i.make_room_with) return `${d} is full. Its cells: ${on.map(c => `${cellTitle(c.t, c.x)} (step ${c.x.id}, ${kindOf(c.t, c.x).toLowerCase()}, priority ${c.t.priority}${c.x.pinned ? ", placed by hand" : ""})`).join("; ")}. ${movable[0] ? `The least important one that can move: "${cellTitle(movable[0].t, movable[0].x)}" (step ${movable[0].x.id}). ` : ""}Nothing changed. Tell the user the day is full and propose which cell to move later, in one short question. When they agree or name another, call move_step again with make_room_with=<that step id>.`;
      const v = i.make_room_with ? on.find(c => c.x.id === String(i.make_room_with)) : movable[0];
      if (!v) throw new Error(i.make_room_with ? `That cell is not on ${d}.` : `Every cell on ${d} is a meeting, a deadline, done or placed by hand. Ask the user which one may move.`);
      const slot = v.x.slot;
      Object.assign(v.x, { date: null, slot: null, pinned: false, notBefore: addDays(d, 1) });
      Object.assign(f.st, { date: d, slot, pinned: true, notBefore: null });
      plan(S);
      return `Moved to ${d}. To make room, "${cellTitle(v.t, v.x)}" moved to ${v.x.date || "a later day"}.`;
    }
    case "swap_cells": {
      const a = findStep(S, String(i.step_a)), b = findStep(S, String(i.step_b));
      if (!a || !b) throw new Error("Unknown step");
      if (!a.st.date || !b.st.date) throw new Error("Both cells must be on the table to swap.");
      const da = a.st.date, sa = a.st.slot;
      Object.assign(a.st, { date: b.st.date, slot: b.st.slot, pinned: true, notBefore: null });
      Object.assign(b.st, { date: da, slot: sa, pinned: true, notBefore: null });
      return `Swapped: "${cellTitle(a.t, a.st)}" is now on ${a.st.date}, "${cellTitle(b.t, b.st)}" is now on ${da}.`;
    }
    case "set_step_status": {
      const { st } = findStep(S, String(i.step_id));
      if (i.status === "done") { st.done = true; st.outcome = null; } else if (i.status === "todo") { st.done = false; st.outcome = null; }
      else if (i.status === "pushed") pushStep(S, st.id); else cancelStep(S, st.id);
      return "Done.";
    }
    case "update_task": {
      const t = S.tasks.find(x => x.id === String(i.task_id));
      if (i.title) t.title = String(i.title); if (i.description) t.desc = String(i.description); if (i.project != null) t.project = String(i.project);
      if (kinds.includes(i.kind)) t.kind = up(i.kind); if (efforts.includes(i.effort)) t.effort = up(i.effort); if (Array.isArray(i.values)) t.values = i.values.map(String);
      return "Updated.";
    }
    case "delete_task": S.tasks = S.tasks.filter(t => t.id !== String(i.task_id)); return "Deleted.";
    case "save_project": {
      const cur = findProject(S, i.name) || {};
      saveProject(S, { name: String(i.name), priority: PRIO[up(i.priority)] ? up(i.priority) : (cur.priority || "NORMAL"), deadline: "deadline" in i ? (i.deadline || null) : (cur.deadline || null),
        notes: i.notes != null ? String(i.notes) : (cur.notes || ""), values: Array.isArray(i.values) ? i.values.map(String) : (cur.values || []),
        blocks: Array.isArray(i.blocks) ? i.blocks.map(String) : (cur.blocks || []) });
      plan(S); return `Project "${i.name}" saved.`;
    }
    case "set_value": {
      const k = S.values.findIndex(v => v.name.toLowerCase() === String(i.name).toLowerCase());
      if (i.remove) { if (k >= 0) S.values.splice(k, 1); return "Removed."; }
      const cur = S.values[k] || { name: String(i.name), weight: 2, meaning: "", min: 0 };
      const nv = { name: cur.name, weight: Math.min(3, Math.max(1, +(i.weight || cur.weight))), meaning: i.meaning != null ? String(i.meaning) : cur.meaning, min: i.min_per_week != null ? +i.min_per_week : cur.min };
      if (k >= 0) S.values[k] = nv; else S.values.push(nv);

    }
    case "set_about": if (Array.isArray(i.easy)) S.about.easy = i.easy.map(String); if (Array.isArray(i.hard)) S.about.hard = i.hard.map(String); if (S.about.profile == null) S.about.profile = "none"; return "Saved.";
    case "find_slots": {
      const slots = findSlots(S, i.from || TODAY, Math.min(30, +(i.days || 10)), Math.min(6, +(i.count || 3)), +(i.duration_minutes || S.meetings.duration));

    }
    case "draft_message": S.draft = { to: String(i.to || ""), text: String(i.text) }; return "The message is ready with a Share button. Tell the user in a few words; don't repeat it all.";
    case "book_meeting": {
      const dur = +(i.duration_minutes || S.meetings.duration), end = hm(toMin(String(i.start)) + dur);
      const t = newTask(S, { title: `${i.start} ${i.title}`, desc: `${i.start}–${end}${i.with ? " with " + i.with : ""}${i.notes ? ". " + i.notes : ""}`, kind: "MEETING", fixedDate: i.date });

    case "add_rule": S.rules.push({ id: uid(), text: String(i.text), on: true }); return "Rule added.";
    case "remember": S.memory = [...new Set([...S.memory, String(i.note)])].slice(-50); return "Saved.";
  }
  throw new Error("Unknown tool " + name);
}

async function send(text) {
  text = String(text || "").trim();
  if (!text || busy) return;
  // A clear yes or no answers changes waiting for confirmation, without asking Claude again.
  if (S.pending.length) {
    const t = text.toLowerCase().replace(/[.!]/g, "").trim();
    if (/^(yes|yeah|yep|ok|okay|sure|correct|do it|go ahead|perfect|oui|d'accord|parfait|vas-y|c'est bon)$/.test(t)) return confirmPending(text);
    if (/^(no|nope|non|wait|stop|cancel|annule)$/.test(t)) return rejectPending(text);
  }
  S.pending = [];
  const sample = await (samplePromise ||= (window.claude ? window.claude.use("sample") : Promise.resolve(null)));
  S.chat.push({ role: "user", content: text });
  if (!sample) { S.chat.push({ role: "assistant", content: "The simulated assistant only runs when this preview is opened in Claude (claude.ai or the Claude app)." }); return render(); }
  busy = true; liveText = ""; toolNote = ""; ctl = new AbortController(); render();
  const used = [];
  const page = chatContext && PAGES[chatContext];
  const allowed = !page || page.scope === "all" ? null : chatContext === "me" ? ["set_value", "set_about", "add_rule", "remember"] : [];
  const tools = TOOLS.filter(t => !allowed || allowed.includes(t.name)).map(t => ({ name: t.name, description: t.description, inputSchema: t.inputSchema, execute: input => {
    toolNote = "Using " + t.name.replace(/_/g, " ") + "..."; const live = $("#live .tools") || null; if (live) live.textContent = toolNote; else renderAssistantLive();
    used.push(t.name.replace(/_/g, " "));
    check(t.name, input);
    if (t.write && S.settings.confirm) {
      const s = summary(t.name, input); S.pending.push({ tool: t.name, input, summary: s });
      return `STAGED, not applied yet: ${s}. Stage anything else this request needs, then stop calling tools, tell the user in one or two short sentences what you understood and what will change, and ask them to confirm.`;
    }
    const r = run(t.name, input); save(); return r;
  } }));
  const history = S.chat.slice(-14).map(c => ({ role: c.role, content: c.content }));
  while (history.length && history[0].role !== "user") history.shift();
  const context = page ? "\n\nCURRENT PAGE: " + page.prompt + (chatContext === "settings" ? "\n" + settingsSummary() : "") : "";
  const input = [{ role: "user", content: systemPrompt() + context + "\n\nCURRENT STATE:\n" + describe() }, ...history];
  try {
    const { text: answer } = await sample(input, { ...(tools.length ? { tools } : {}), signal: ctl.signal, onText: ({ text }) => { liveText = text; const el = $("#live"); if (el) el.firstChild.textContent = text; } });
    S.chat.push({ role: "assistant", content: answer.trim(), tools: used.length ? [...new Set(used)].join(" · ") : "" });
  } catch (e) {
    const copy = { not_granted: "Claude isn't allowed for this page. Allow it when asked to try the assistant.", rate_limited: "Too many requests right now. Try again in a minute.",
      session_expired: "Sign in to Claude again, then retry.", tools_unavailable: "This view can't run the assistant's tools. Open the preview in claude.ai.", refused: "Claude declined that request. Rephrase it." }[e && e.code];
    if (e && e.code !== "cancelled") S.chat.push({ role: "assistant", content: (e.text ? e.text + "\n\n" : "") + (copy || "Something went wrong. Try again.") });
    else if (e && e.text) S.chat.push({ role: "assistant", content: e.text + " (stopped)" });
  } finally { busy = false; ctl = null; liveText = ""; toolNote = ""; render(); }
}
function renderAssistantLive() { if (tab === "assistant") { const keep = $("#msg") ? $("#msg").value : ""; renderAssistant(); $("#msg").value = keep; } }
function confirmPending(text = "Yes, do it.") {
  const lines = S.pending.map(p => { try { const r = run(p.tool, p.input); return r.length < 40 ? p.summary + ": done." : r.split(". Cells:")[0] + "."; } catch (e) { return `${p.summary}: failed (${e.message}).`; } });
  S.pending = []; S.chat.push({ role: "user", content: text }, { role: "assistant", content: lines.join("\n") }); render();
}

  if (act === "notice-ok") { S.notice = null; return render(); }
  if (act === "updates") return updatesSheet();
  if (act === "about-voice") return goAssistant("ABOUT ME: ");
  if (act === "about-type") return aboutTyping();
  if (act === "profiles") return profilesDialog(null);
  if (act === "welcomed") { S.about.welcomed = true; return render(); }
  if (b.dataset.ex) { if (chatContext && !b.dataset.ex.endsWith(":")) return send(b.dataset.ex); $("#msg").value = b.dataset.ex; return $("#msg").focus(); }
  const as = b.dataset.as;
  if (as === "send") return send($("#msg").value);
  if (as === "stop") return ctl && ctl.abort();
  if (as === "yes") return confirmPending();
  if (as === "no") return rejectPending();
  if (as === "clear") { S.chat = []; S.pending = []; return render(); }
  if (as === "close-draft") { S.draft = null; return render(); }
  if (as === "copy") { const t = S.draft.text; navigator.clipboard.writeText(t).then(() => { b.textContent = "Copied"; }, () => { const r = document.createRange(); r.selectNodeContents($("#draft-text")); getSelection().removeAllRanges(); getSelection().addRange(r); }); return; }
  const me = b.dataset.me;
  if (me === "add-value") return valueDialog(null);
  if (me === "edit-value") return valueDialog(+b.dataset.i);
  if (me === "w") { const v = S.values[+b.dataset.i], n = +b.dataset.n; v.weight = v.weight === n && n > 1 ? n - 1 : n; plan(S); return render(); }
  if (me && me.startsWith("rm-")) { S.about[me.slice(3)].splice(+b.dataset.i, 1); return render(); }
  if (me && me.startsWith("add-")) { const k = me.slice(4), inp = $("#add-" + k); if (inp.value.trim()) { S.about[k] = [...new Set([...S.about[k], inp.value.trim()])]; } return render(); }
  if (b.dataset.ai === "wizard") return aiWizard(1);
  if (b.dataset.rep === "setup") return repliesWizard(1);
  if (b.dataset.rep === "off") { S.replies.on = false; save(); return render(); }
  if (b.dataset.ai === "remove") { S.ai = null; return render(); }
  if (b.dataset.set === "lang-en") { S.settings.dayLang = "en"; return render(); }
  if (b.dataset.set === "lang-fr") { S.settings.dayLang = "fr"; return render(); }
  const m = S.meetings;
  if (b.dataset.chk) { S.checks[b.dataset.chk] = !S.checks[b.dataset.chk]; return render(); }
  if (b.dataset.unlearn) { S.learned = S.learned.filter(l => l.id !== b.dataset.unlearn); return render(); }
  if (b.dataset.rmtime) { S.checks.times = S.checks.times.filter(t => t !== b.dataset.rmtime); return render(); }
  if (b.dataset.mday) { const d = +b.dataset.mday; m.days = m.days.includes(d) ? m.days.filter(x => x !== d) : [...m.days, d].sort(); return render(); }
  if (b.dataset.mdur) { m.duration = +b.dataset.mdur; return render(); }
  if (b.dataset.mmax) { m.maxPerDay = +b.dataset.mmax; return render(); }
  if (b.dataset.mbuf) { m.buffer = +b.dataset.mbuf; return render(); }
  if (b.id === "reset") { S = exampleState(); renderTable.scrolled = false; return render(); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.rule) { S.rules[+el.dataset.rule].on = el.checked; return render(); }
  if (el.id === "set-dark") { S.settings.theme = el.checked ? "dark" : "light"; return render(); }
  if (el.id === "set-focus") { S.checks.focus = el.checked; return render(); }
  if (el.id === "set-buywords") { const w = el.value.split(",").map(x => x.trim()).filter(Boolean); S.settings.buyWords = w.length ? w : BUY_WORDS.slice(); save(); return; }
  if (el.id === "add-time" && el.value) { S.checks.times = [...new Set([...S.checks.times, el.value])].sort(); return render(); }
  if (el.id === "set-confirm") { S.settings.confirm = el.checked; return render(); }
  if (el.id === "set-windows") { const w = el.value.split(",").map(x => x.trim()).filter(x => /^\d{1,2}:\d{2}\s*[-–]\s*\d{1,2}:\d{2}$/.test(x)); if (w.length) S.meetings.windows = w; return render(); }
});
document.addEventListener("keydown", e => {
  if (e.target.id === "list-add" && e.key === "Enter") { e.preventDefault(); return document.querySelector('[data-act="list-add"]').click(); }
  if (e.target.id === "msg" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(e.target.value); }
  if (e.key === "Escape" && $("#scrim") && !document.querySelector(".dialog input:not([type=hidden]), .dialog textarea")) close();
  if (e.target.id && e.target.id.startsWith("add-") && e.key === "Enter") { const k = e.target.id.slice(4); if (e.target.value.trim()) S.about[k] = [...new Set([...S.about[k], e.target.value.trim()])]; render(); }
});

load(); ensureBuy();
// "Check when I open the app": one check per visit (in the app this also runs when you leave and at the set times).
if (S.checks && S.checks.onOpen) checkNow();
render();
samplePromise = window.claude ? window.claude.use("sample") : Promise.resolve(null);
samplePromise.then(() => { if (tab === "assistant") renderAssistantLive(); });
</script>

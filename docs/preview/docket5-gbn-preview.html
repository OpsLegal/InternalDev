<title>Docket 5 Ground Build Nourish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
<style>
/* Layout: one phone-width column, the app's own screens stacked above a bottom tab bar, like the Android app. */
:root {
  --bg: #FAFAF7; --surface: #FFFFFF; --variant: #F1F2F4; --outline: #D0D4D9;
  --fg: #1B1F24; --muted: #5B6470; --primary: #3D4A57;
  --yellow: #FFE14D; --ink: #1F2933;
  --navy: #1F2A44; --slate: #46505E; --bordeaux: #5C2A33; --pewter: #6B7280; --rec: #9B2C2C;
  --k-task: #1E4E8C; --k-meet: #111111; --k-dead: #B3261E;
  --k-task-y: #1E4E8C; --k-meet-y: #111111; --k-dead-y: #B3261E;
  --k-proj: #1B6B43; --k-proj-y: #1B6B43; --bar: #2E8B57;
  --dialog: rgba(255,255,255,.97); --scrim: rgba(0,0,0,.25); --error: #B3261E;
  --font: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15181B; --surface: #1C2024; --variant: #262B30; --outline: #3A4148;
  --fg: #E6E8EA; --muted: #A3ABB4; --primary: #C6D0DA;
  --k-task: #9DB8E8; --k-meet: #F1F1F1; --k-dead: #F2A7A0; --k-proj: #86D3A8; --bar: #5BBF8A;
  --dialog: rgba(28,32,36,.97); --scrim: rgba(0,0,0,.45); --error: #F2A7A0; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15181B; --surface: #1C2024; --variant: #262B30; --outline: #3A4148;
  --fg: #E6E8EA; --muted: #A3ABB4; --primary: #C6D0DA;
  --k-task: #9DB8E8; --k-meet: #F1F1F1; --k-dead: #F2A7A0; --k-proj: #86D3A8; --bar: #5BBF8A;
  --dialog: rgba(28,32,36,.97); --scrim: rgba(0,0,0,.45); --error: #F2A7A0; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.4 var(--font); }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
.app { max-width: 480px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; position: relative; }
.screen { flex: 1; overflow-y: auto; padding: 8px 16px 24px; min-height: 0; }
.bar { display: flex; justify-content: space-around; border-top: 1px solid var(--outline); background: var(--surface);
  padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0px)); }
.bar button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 12px; color: var(--muted); padding: 4px 10px; border-radius: 16px; cursor: pointer; }
.bar button[aria-current="page"] { color: var(--fg); font-weight: 500; }
.bar button[aria-current="page"] svg { background: var(--variant); border-radius: 12px; }
.bar svg { width: 44px; height: 26px; padding: 3px 10px; }
.bar button { padding: 4px 4px; }
.proj-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 12px; cursor: pointer; border: 0; width: 100%; text-align: left; }
.pct { font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }
.track { position: relative; height: 10px; border-radius: 5px; background: var(--variant); grid-column: 1 / -1; }
.track .done { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 5px; background: var(--bar); }
.track .plan { position: absolute; top: 3px; bottom: 3px; border-radius: 3px; background: color-mix(in srgb, var(--bar) 35%, transparent); }
.track .late { position: absolute; top: 3px; bottom: 3px; border-radius: 3px; background: var(--k-dead); }
.track .mark { position: absolute; top: -3px; bottom: -3px; width: 2px; }
.track .today { background: var(--fg); } .track .dl { background: var(--k-dead); }
.status { font-size: 12px; } .status.late { color: var(--k-dead); font-weight: 500; } .status.ok { color: var(--k-proj); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

h1 { font-size: 22px; font-weight: 700; margin: 8px 0; }
h2 { font-size: 20px; font-weight: 400; margin: 18px 0 4px; }
.small { font-size: 12px; color: var(--muted); }
.note { font-size: 12px; color: var(--muted); background: var(--variant); border-radius: 8px; padding: 8px 10px; }
.card { background: var(--surface); border-radius: 12px; padding: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.row { display: flex; gap: 8px; align-items: center; }
.wrap { display: flex; flex-wrap: wrap; gap: 6px; }
.grow { flex: 1; min-width: 0; }

/* Table */
.gaps { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.table { display: flex; flex-direction: column; gap: 3px; }
.line { display: grid; grid-template-columns: 40px repeat(5, minmax(0, 1fr)); gap: 3px; height: 62px; }
/* The day's events sit on the same background as its day label, joined to it: one block that reads as that day. */
.calstrip { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.calstrip button.added { background: var(--fg); color: var(--bg); border-style: solid; }
.calstrip.alldone { background: var(--yellow); }
.calstrip.alldone button.skipped { border-color: rgba(0,0,0,.3); }
.day.joined { border-top-left-radius: 0; border-top-right-radius: 0; }
.calstrip button { font: inherit; font-size: 13px; border: 1px dashed var(--fg); background: var(--bg); color: var(--fg); border-radius: 12px; padding: 2px 8px; cursor: pointer; }
.calstrip button.skipped { border: 1px solid var(--yellow); background: var(--yellow); color: var(--ink); }
.line.today { outline: 2px solid var(--primary); outline-offset: 1px; border-radius: 8px; }
.day, .cell { border-radius: 6px; display: flex; align-items: center; justify-content: center; text-align: center; min-width: 0; }
.day { background: var(--surface); font-size: 13px; flex-direction: column; gap: 3px; }
/* The day's calendar: dark with a count = events to review; yellow = all reviewed; light 0 = none. Tap to see them. */
.calbadge { font: inherit; font-size: 10px; font-weight: 700; line-height: 1; border-radius: 9px; padding: 3px 5px; cursor: pointer;
  border: 1px solid var(--outline); background: transparent; color: var(--muted); }
.calbadge.todo { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.calbadge.ok { background: var(--yellow); color: var(--ink); border-color: rgba(0,0,0,.25); }
.day.alldone { background: var(--yellow); color: var(--ink); }
.cell { border: 1px solid var(--outline); background: var(--bg); padding: 3px; font-size: 10.5px; line-height: 1.2;
  overflow: hidden; cursor: pointer; }
.cell.filled { background: var(--variant); }
.cell.done { background: var(--yellow); }
.cell.grey { background: var(--outline); color: var(--muted); }
.cell.cancelled span { text-decoration: line-through; }
.cell span { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
.cell.past { cursor: default; }
.cell .plus { font-weight: 700; white-space: nowrap; }
.riders { display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--outline); border-radius: 10px; padding: 8px 10px; }
.riders label { display: flex; gap: 8px; align-items: center; }
.cell.missed { background: #F6C4BE; color: #7A1E14; }
.missed-note { background: #F6C4BE; color: #7A1E14; border-radius: 8px; padding: 8px; font-size: 13px; }
.k-PROJECT { color: var(--k-proj); } .done.k-PROJECT { color: var(--k-proj-y); }
.cell.proj { box-shadow: inset 3px 0 0 var(--bar); }
.projlink { border: 0; background: none; padding: 0; color: var(--k-proj); font-weight: 500; cursor: pointer; font-size: 13px; text-decoration: underline; text-underline-offset: 2px; }
.head { display: flex; align-items: center; gap: 8px; }
/* The top of the table stays put: title, Today, the bell and any message are always in sight. */
.buymic { display: flex; gap: 12px; align-items: center; }
.buymic .round { width: 52px; height: 52px; flex: none; }
.buymic .round.rec { background: #9B2C2C; }
.buyrow { display: flex; align-items: center; gap: 8px; padding: 6px 2px; border-bottom: 1px solid color-mix(in srgb, var(--outline) 40%, transparent); }
.buyrow input { width: 20px; height: 20px; }
.buyrow.bought span { text-decoration: line-through; color: var(--muted); }
.sticky { position: sticky; top: -8px; z-index: 3; margin: -8px -16px 0; padding: 8px 16px 6px; background: var(--bg); }
.bell { position: relative; width: 44px; height: 44px; border: 0; background: none; border-radius: 50%; cursor: pointer; display: grid; place-items: center; color: var(--fg); }
.bell svg { width: 24px; height: 24px; }
.badge { position: absolute; top: 4px; right: 2px; min-width: 18px; height: 18px; border-radius: 9px; background: #111; color: #fff; box-shadow: 0 0 0 2px var(--bg); font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }
.badge.urgent { background: var(--k-dead); color: #fff; }
.action .round { position: relative; }
.action .badge { top: -4px; right: -4px; min-width: 24px; height: 24px; border-radius: 12px; font-size: 13px; }
.action .badge.zero { background: var(--outline); color: var(--muted); }
.rrow { border-bottom: 1px solid var(--outline); padding: 6px 0; }
.rrow .t { display: flex; gap: 8px; align-items: center; }
.rrow .t b { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.rrow .sub { font-size: 12px; color: var(--muted); margin-left: 26px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rrow .acts { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 0 26px; }
.rrow .acts button { font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 14px; border: 1px solid var(--outline); background: var(--surface); color: var(--fg); }
.rrow.late b { color: var(--k-dead); }
.rhead { display: flex; justify-content: space-between; font-weight: 700; margin-top: 8px; }
.stats4 { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; padding: 6px 0; border-bottom: 1px solid var(--outline); }
.stats4 b { display: block; } .stats4 span { font-size: 11px; color: var(--muted); }
.upd { display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--outline); border-radius: 12px; padding: 10px 12px; }
.upd .src { font-size: 11px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.upd .src b { color: var(--fg); font-weight: 500; }
.upd .quote { font-size: 13px; border-left: 3px solid var(--outline); padding-left: 8px; color: var(--muted); font-style: italic; }
.upd .prop { font-size: 14px; }
.upd .prop li { margin-left: -6px; }
.upd .btns { display: flex; gap: 6px; flex-wrap: wrap; }
.upd .btns .btn { padding: 7px 14px; }
.thread { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.thread > div { border-left: 3px solid var(--outline); padding: 2px 8px; color: var(--fg); }
.thread > div.me { border-left-color: var(--primary); color: var(--muted); }
.thread > div.old { opacity: .55; }
.thread b { font-weight: 600; font-size: 11px; }
.pill.cc { background: var(--slate); }
.pill { font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; border-radius: 4px; padding: 1px 5px; background: var(--k-dead); color: #fff; }
.notice { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.notice.warn { border: 1px solid var(--k-dead); }
.k-TASK { color: var(--k-task); } .k-MEETING { color: var(--k-meet); } .k-DEADLINE { color: var(--k-dead); }
.done.k-TASK { color: var(--k-task-y); } .done.k-MEETING { color: var(--k-meet-y); } .done.k-DEADLINE { color: var(--k-dead-y); }
.strong span { font-weight: 500; }

.fabs { position: absolute; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; align-items: flex-end; touch-action: none; }
.fabs.dragging { opacity: .85; }
#i-text { min-height: 150px; }
.round { width: 64px; height: 64px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; color: #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.round svg { width: 29px; height: 29px; }
.round.navy { background: var(--navy); } .round.slate { background: var(--slate); } .round.bordeaux { background: var(--bordeaux); }
.round.pewter { background: var(--pewter); } .round.rec { background: var(--rec); } .round.yellow { background: var(--yellow); color: var(--ink); }
.action { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; }
.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 6px; justify-items: center; margin-top: 6px; }

/* Buttons and tags */
.btn { border: 0; background: var(--primary); color: var(--bg); border-radius: 20px; padding: 8px 16px; cursor: pointer; font-weight: 500; }
.btn.outline { background: transparent; color: var(--primary); border: 1px solid var(--outline); }
.text { border: 0; background: none; color: var(--primary); font-weight: 500; padding: 8px 10px; cursor: pointer; border-radius: 16px; }
.text.danger { color: var(--error); }
.tag { border: 1px solid color-mix(in srgb, var(--outline) 60%, transparent); background: var(--variant); border-radius: 7px;
  padding: 3px 10px; font-size: 12px; cursor: pointer; min-height: 28px; }
.tag { white-space: nowrap; }
.tags1 { display: flex; gap: 4px; width: 100%; }
.tags1 .tag { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; padding: 3px 2px; min-height: 34px; font-size: 12px; letter-spacing: -0.1px; }
.tag[aria-pressed="true"] { background: color-mix(in srgb, var(--primary) 18%, var(--surface)); border-color: transparent; font-weight: 500; }
.tag.kind-TASK { color: var(--k-task); } .tag.kind-MEETING { color: var(--k-meet); } .tag.kind-DEADLINE { color: var(--k-dead); }

/* Dialog */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; padding: 16px; z-index: 10; }
.dialog { background: var(--dialog); border-radius: 28px; width: min(88vw, 420px); max-height: 86vh; display: flex; flex-direction: column;
  padding: 22px 22px 12px; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.dialog h3 { font-size: 17px; font-weight: 500; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
.dialog .body { overflow-y: auto; display: flex; flex-direction: column; gap: 9px; padding: 2px; }
.dialog .foot { display: flex; justify-content: flex-end; gap: 4px; padding-top: 8px; }
.field { position: relative; display: block; flex: 1; min-width: 0; margin-top: 7px; }
.field > span { position: absolute; top: -7px; left: 9px; padding: 0 4px; font-size: 11px; line-height: 14px; color: var(--muted);
  background: var(--dialog); background: linear-gradient(var(--surface), var(--surface)); }
.field input, .field textarea { width: 100%; border: 1px solid var(--outline); border-radius: 6px; background: transparent; color: var(--fg);
  font: 14px var(--font); padding: 9px 12px; min-height: 38px; resize: vertical; }
.field input:focus, .field textarea:focus { outline: none; border: 1.5px solid var(--primary); }
.field:focus-within > span { color: var(--primary); }
.q { width: 24px; height: 28px; border: 0; background: none; border-radius: 50%; color: var(--muted); opacity: .55; font-weight: 300; font-size: 13px; cursor: pointer; flex: none; padding: 0; }
.q[aria-expanded="true"] { color: var(--primary); opacity: 1; }
.help { font-size: 12px; color: var(--muted); padding-right: 24px; }
.menu { border: 1px solid var(--outline); border-radius: 6px; background: var(--surface); max-height: 168px; overflow-y: auto; margin: 2px 24px 0 0; }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 12px; font-size: 13px; cursor: pointer; }
.menu button:hover, .menu button:focus-visible { background: var(--variant); }
.menu .create { color: var(--primary); font-weight: 500; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--outline); border-radius: 18px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 7px 8px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: color-mix(in srgb, var(--primary) 18%, var(--surface)); font-weight: 500; }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choices .btn { padding: 12px 16px; font-size: 15px; }
.steps { display: flex; flex-direction: column; gap: 2px; }
.step { display: grid; grid-template-columns: 24px 20px 1fr auto; align-items: center; gap: 4px; min-height: 32px; }
.step .tools2 { display: flex; }
.sday { display: flex; align-items: center; gap: 4px; padding-left: 48px; font-size: 11px; color: var(--bar); margin: -2px 0 4px; }
.sday label { position: relative; cursor: pointer; padding: 2px 0; }
.sday label.late { color: var(--k-dead); }
.sday input[type=date] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.sday .text { font-size: 11px; padding: 2px 6px; }
.step .n { font-size: 12px; color: var(--muted); text-align: right; }
.step.done span:last-of-type { color: var(--muted); text-decoration: line-through; }
.step input { border: 1px solid var(--primary); border-radius: 6px; background: transparent; color: var(--fg); font: 13px var(--font); padding: 6px 8px; width: 100%; }
.icon { width: 28px; height: 28px; border: 0; background: none; border-radius: 50%; color: var(--muted); cursor: pointer; display: grid; place-items: center; padding: 0; font-size: 16px; }
.icon svg { width: 16px; height: 16px; }
.field input[type="date"] { min-height: 38px; }
.glabel { font-size: 11px; color: var(--muted); padding-left: 4px; }
.fieldrow { display: flex; align-items: flex-end; gap: 0; }
.err { color: var(--error); font-size: 13px; }

/* Assistant */
.chat { display: flex; flex-direction: column; gap: 6px; padding-bottom: 8px; }
.bubble { max-width: 84%; border-radius: 12px; padding: 9px 11px; white-space: pre-wrap; word-break: break-word; }
.bubble.me { align-self: flex-end; background: var(--primary); color: var(--bg); }
.bubble.ai { align-self: flex-start; background: var(--variant); }
.bubble .tools { font-size: 11px; color: var(--muted); margin-top: 4px; }
.composer { display: flex; gap: 8px; align-items: flex-end; padding: 8px 16px; border-top: 1px solid var(--outline); }
.composer textarea { flex: 1; border: 1px solid var(--outline); border-radius: 8px; background: var(--surface); color: var(--fg);
  font: 14px var(--font); padding: 10px 12px; resize: none; min-height: 44px; max-height: 120px; }
.composer .round { width: 48px; height: 48px; } .composer .round svg { width: 22px; height: 22px; }
.progress { height: 3px; background: linear-gradient(90deg, transparent, var(--primary), transparent); background-size: 50% 100%;
  animation: slide 1.2s linear infinite; background-repeat: no-repeat; }
@keyframes slide { from { background-position: -50% 0 } to { background-position: 150% 0 } }
@media (prefers-reduced-motion: reduce) { .progress { animation: none; background: var(--primary); } }
.confirm { border: 1px solid var(--outline); }
.confirm ul { margin: 6px 0; padding-left: 18px; }

/* About me */
.presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
:root { --g-ground: #B9BEC6; --g-build: #4A5A78; --g-nourish: #7A3E4A; --g-off: #ECEDEF; --g-ground-ink: #6B7280; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --g-ground: #8D949E; --g-build: #8E9DBA; --g-nourish: #B98591; --g-off: #2B3036; --g-ground-ink: #A9AFB8; } }
:root[data-theme="dark"] { --g-ground: #8D949E; --g-build: #8E9DBA; --g-nourish: #B98591; --g-off: #2B3036; --g-ground-ink: #A9AFB8; }
/* The strip: every attribute side by side, one small histogram each, the colour says the category. */
.strip { display: flex; flex-direction: column; gap: 4px; }
.strip .heads, .strip .bars { display: flex; gap: 3px; }
.strip .head { min-width: 0; overflow: hidden; white-space: nowrap; gap: 3px; letter-spacing: -.2px; font-size: 10.5px; font-weight: 700; display: flex; justify-content: space-between; border-bottom: 2px solid var(--bk); color: var(--hink, var(--bk)); padding-bottom: 1px; }
.strip .head span { font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.strip .col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 2px; align-items: stretch; border: 0; background: none; padding: 0; font: inherit; color: inherit; }
.strip .blk { height: 12px; border-radius: 3px; background: var(--g-off); border: 0; padding: 0; cursor: pointer; }
.strip .blk.on { background: var(--bk); }
.strip .nm { font-size: 9.5px; letter-spacing: -.2px; line-height: 1.15; text-align: center; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.strip .nm b { font-weight: 400; }
.strip.small .blk { height: 8px; cursor: default; }
.strip .col.dim .blk.on { opacity: .28; }
.strip .col.dim .nm, .strip .col.dim0 .nm { color: var(--muted); }
.strip.week .blk { height: 6px; cursor: default; }
.strip.week .nm { font-size: 8.5px; }
.strip.task .blk { height: 11px; cursor: pointer; }

  screen.scrollTo({ top: screen.scrollTop + el.getBoundingClientRect().top - head.getBoundingClientRect().bottom - 6, behavior: smooth ? "smooth" : "auto" });
}
function renderTable() {
  const g = gaps(S);
  const rs = rows(S, addDays(TODAY, -7), 7 + 45);
  // First launch, one card at a time: the welcome, then "tell me about you".
  const profile = !S.about.welcomed ? welcomeCard()
    : !S.eqDone ? `<div style="margin:4px 0 8px">${equalizerCard()}</div>` : "";
  const w = waiting(), total = panelCount(), red = w.urgent || reviewDue(w) || flags().some(f => f.red);
  $("#screen").innerHTML = `<div class="sticky" id="tablehead"><div class="head"><h1 class="grow">My 5 a day</h1>
      <button class="bell" data-act="cart" aria-label="To buy: ${S.buy.filter(x => !x.done).length} items">${ICON.cart}${S.buy.some(x => !x.done) ? `<span class="badge ${buyDue() ? "urgent" : ""}">${S.buy.filter(x => !x.done).length}</span>` : ""}</button>
      <button class="btn outline" data-act="today" style="padding:5px 12px">Today</button>
      <button class="bell" data-act="updates" aria-label="Updates: ${total} waiting${red ? ", needs you now" : ""}">${ICON.bell}${total ? `<span class="badge ${red ? "urgent" : ""}">${total}</span>` : ""}</button></div>
    ${S.eqDone ? weekStrip() : g.length ? `<div class="gaps">This week: ${g.map(x => `${esc(x.v.name)} ${x.n}/${x.v.min}`).join(" · ")}</div>` : ""}
    ${S.notice ? `<div class="card notice ${S.notice.warn ? "warn" : ""}" style="margin:4px 0 0"><div class="grow">${esc(S.notice.text)}</div><button class="text" data-act="notice-ok">OK</button></div>` : ""}</div>
    <div class="table">${rs.map((r, ri) => {
      const done = r.cells.filter(c => c && c.st.done).length, open = r.cells.filter(c => c && !c.st.done && !c.st.outcome).length;
      const past = r.date < TODAY;
      // The first-launch card sits just above today's line, so the table opens on both.
      const first = ri === rs.findIndex(x => x.date >= TODAY); // today, or the next working day
      // A day is complete when its cells are done and the next day's calendar events are reviewed (it is their review day).
      const next = rs[ri + 1], complete = done && !open && (!next || calReviewed(next.date));
      return (first ? profile : "") + `<div class="line ${r.date === TODAY ? "today" : ""}" ${first ? 'id="today"' : ""}>
        <div class="day ${complete ? "alldone" : ""}" style="${r.date === TODAY ? "font-weight:700" : ""}"><span>${label(r.date, S.settings.dayLang)}</span>${past ? "" : calBadge(r.date)}</div>
        ${r.cells.map(c => {
          if (!c) return `<button class="cell ${past ? "past" : ""}" ${past ? "disabled" : `data-empty="${r.date}"`} aria-label="Add a task on ${r.date}"></button>`;
          const { t, st } = c, missed = st.outcome === "MISSED" || (past && isMissed(st)), grey = !!st.outcome && !missed;
          const k = kindOf(t, st), colour = k !== "TASK" ? k : t.project ? "PROJECT" : "TASK";
          const cls = ["cell", "filled", "k-" + colour, t.project && "proj", st.done && "done", grey && "grey", st.outcome === "CANCELLED" && "cancelled",
            missed && "missed", projectWeight(S, t) >= 3 && !grey && "strong"].filter(Boolean).join(" ");
          const extra = (st.riders || []).filter(x => !x.done).length;
          return `<button class="${cls}" data-cell="${st.id}" data-date="${r.date}"><span>${st.outcome === "PUSHED" ? "↷ " : ""}${esc(cellTitle(t, st))}${extra ? ` <b class="plus">+${extra}</b>` : ""}</span></button>`;
        }).join("")}</div>`;
    }).join("")}</div><div style="height:240px"></div>`;
  requestAnimationFrame(() => { if (!renderTable.scrolled) { goToday(false, true); renderTable.scrolled = true; } });
  $("#composer").innerHTML = "";
}

/* ---------- Calendar events: you choose which ones take cells in your day ---------- */
const calKey = e => `${e.date}|${e.start || "all"}|${e.title}`;
/** About 1.5 h per cell: up to 2 h is one cell, a half-day two, an all-day event the whole day. */
const calCells = e => e.allDay ? 5 : Math.min(5, Math.max(1, Math.ceil((toMin(e.end) - toMin(e.start) - 30) / 90)));
const calWhen = e => e.allDay ? "all day" : `${e.start}–${e.end}`;
function calBadge(d) {
  const evs = (S.calendar || []).filter(e => e.date === d), open = evs.filter(e => !(S.calDecisions || {})[calKey(e)]).length;
  const cls = !evs.length ? "" : open ? "todo" : "ok";
  return `<button class="calbadge ${cls}" data-calday="${d}" aria-label="${evs.length ? `${evs.length} calendar events, ${open} to review` : "No calendar events"}">📅 ${evs.length}</button>`;
}
/** A day's calendar: each event in the day (a cell) or not (yellow); one tap leaves the rest out. */
function calDayDialog(d) {
  const evs = (S.calendar || []).filter(e => e.date === d).sort((a, b) => (a.start || "").localeCompare(b.start || ""));
  const dec = e => (S.calDecisions || {})[calKey(e)];
  const open = evs.filter(e => !dec(e));
  dialog(`<h3>📅 ${esc(dayName(d))}</h3><div class="body">
    ${evs.length ? `<div class="small">Tap an event: <b>in my day</b> (it takes a cell) or <b>not in my day</b> (it stays in your calendar).</div>
    <div class="calstrip">${evs.map(e => { const x = dec(e);
      return `<button class="${x && !x.add ? "skipped" : x && x.add ? "added" : ""}" data-calev="${esc(calKey(e))}">${e.allDay ? "" : esc(e.start) + " "}${esc(e.title)}${x && x.add ? " ✓ in my day" : ""}</button>`; }).join("")}</div>
    ${open.length > 1 || (open.length && open.length < evs.length) ? `<button class="btn outline" data-cd="rest">Leave the rest out (${open.length})</button>` : ""}`
    : `<div class="small">Nothing in your calendar this day.</div>`}</div>
    <div class="foot"><button class="text" data-cd="close">Close</button></div>`, host => {
    host.querySelectorAll("[data-cd]").forEach(b => b.addEventListener("click", () => {
      if (b.dataset.cd === "rest") { open.forEach(e => S.calDecisions[calKey(e)] = { skip: true }); save(); render(); return calDayDialog(d); }
      close(); render();
    }));
    host.querySelectorAll("[data-calev]").forEach(b => b.addEventListener("click", () => calDialog(b.dataset.calev, () => calDayDialog(d))));
  });
}
/** Every event of [d] is reviewed: in the day, or left out. The day before in the table is their review day. */
function calReviewed(d) { return (S.calendar || []).filter(e => e.date === d).every(e => (S.calDecisions || {})[calKey(e)]); }
/** Above its day: events still to review (dashed), and the ones reviewed and left out (yellow, for information; tap to change). */
function calStrip(d, complete) {
  S.calDecisions ||= {};
  const evs = (S.calendar || []).filter(e => e.date === d && !(S.calDecisions[calKey(e)] || {}).add);
  if (!evs.length) return "";
  return `<div class="calstrip ${complete ? "alldone" : ""}">${evs.map(e => { const k = calKey(e), skip = S.calDecisions[k] && S.calDecisions[k].skip;
    return `<button class="${skip ? "skipped" : ""}" data-calev="${esc(k)}" aria-label="${skip ? "Reviewed, not in your day: " : "To review, from your calendar: "}${esc(e.title)}">📅 ${e.allDay ? "" : esc(e.start) + " "}${esc(e.title)}</button>`; }).join("")}</div>`;
}
/** Puts an event in its day: black meeting cells, fixed to that day; less important work moves to make room. */
function addCalendarEvent(s, e) {
  const ids = [], n = calCells(e); s.calDecisions ||= {};
  for (let i = 0; i < n; i++) {
    const t = newTask(s, { title: i ? `${e.title} (cont.)` : `${e.allDay ? "" : e.start + " "}${e.title}`, desc: `${calWhen(e)}, from your calendar.`, kind: "MEETING", fixedDate: e.date });
    const st = t.steps[0];
    if (!pin(s, t, e.date, st)) {
      const day = cellsOn(s, e.date).filter(c => !c.st.done && !c.st.outcome && kindOf(c.t, c.st) === "TASK");
      const victim = day.filter(c => !c.st.pinned).pop() || day.pop();
      if (victim) { Object.assign(victim.st, { date: null, slot: null, pinned: false, notBefore: addDays(e.date, 1) }); pin(s, t, e.date, st); }
    }
    ids.push(t.id);
  }
  plan(s);
  s.calDecisions[calKey(e)] = { add: true, ids };
}
function calDialog(key, back) {
  const e = S.calendar.find(x => calKey(x) === key); if (!e) return;
  const n = calCells(e), inDay = ((S.calDecisions || {})[key] || {}).add;
  const x = JSON.parse(JSON.stringify(S)); addCalendarEvent(x, e);
  const before = {}; S.tasks.forEach(t => t.steps.forEach(st => before[st.id] = st.date));
  const moved = x.tasks.flatMap(t => t.steps.filter(st => before[st.id] && st.date !== before[st.id] && !st.done).map(st => `“${cellTitle(t, st)}” → ${st.date ? dayName(st.date) : "no free day yet"}`));
  const left = 5 - cellsOn(x, e.date).filter(c => !c.st.outcome).length;
  dialog(`<h3>📅 ${esc(e.title)}</h3><div class="body">
    <div class="small">${esc(dayName(e.date))}, ${esc(calWhen(e))} · from your calendar</div>
    <div class="choices">
      ${inDay ? `<div>It is in your day ✓</div><button class="btn outline" data-k="out">Take it out of my day</button>
      <div class="small">Its cell${n === 1 ? "" : "s"} free${n === 1 ? "s" : ""} up for work; the event stays in your calendar.</div>` : `
      <button class="btn" data-k="add">Add to my day</button>
      <div class="small">Takes ${n === 5 ? "the whole day" : n === 1 ? "1 cell" : n + " cells"} (black). ${dayName(e.date)}: ${left} cell${left === 1 ? "" : "s"} left for work.${moved.length ? ` Moves: ${esc(moved.join("; "))}.` : ""}</div>
      <button class="btn outline" data-k="skip">Not in my day</button>
      <div class="small">Lunch, someone else's event, a reminder… It stays in your calendar and turns yellow (reviewed), without taking a cell.</div>
      <div class="small">Reviewing ${esc(dayName(e.date))}'s events is part of completing the day before.</div>`}
    </div></div>
    <div class="foot"><button class="text" data-k="close">Close</button></div>`, host => {
    host.querySelectorAll("[data-k]").forEach(b => b.addEventListener("click", () => {
      const a = b.dataset.k;
      if (a === "add") { addCalendarEvent(S, e); S.notice = { text: `${e.title} is in your day${moved.length ? `. Moved: ${moved.join("; ")}` : ""}.`, warn: false }; }
      if (a === "skip") S.calDecisions[key] = { skip: true };
      if (a === "out") { const ids = S.calDecisions[key].ids || []; S.tasks = S.tasks.filter(t => !ids.includes(t.id)); S.calDecisions[key] = { skip: true }; plan(S); }
      save(); render(); if (back && a !== "close") return back(); close();
    }));
  });
}

/* ---------- dialogs ---------- */
function dialog(html, bind) {
  const host = $("#dialogs");
  host.innerHTML = `<div class="scrim" id="scrim"><div class="dialog" role="dialog" aria-modal="true">${html}</div></div>`;
  // A form the user types in never closes on a tap outside (only its buttons close it), so nothing typed is lost.
  const isForm = () => !!document.querySelector(".dialog input:not([type=hidden]), .dialog textarea");
  $("#scrim").addEventListener("click", e => { if (e.target.id === "scrim" && !isForm()) close(); });
  host.querySelectorAll(".q").forEach(q => q.addEventListener("click", () => {
    const h = q.closest("[data-help]").querySelector(".help"); h.hidden = !h.hidden; q.setAttribute("aria-expanded", String(!h.hidden));
  }));
  bind && bind(host);
  const first = host.querySelector("input,textarea"); if (first && !first.value) first.focus();
}
function close() { $("#dialogs").innerHTML = ""; }
const field = (id, labelText, value, help, multi) => `<div data-help><div class="fieldrow"><label class="field"><span>${labelText}</span>${multi
  ? `<textarea id="${id}" rows="2">${esc(value)}</textarea>` : `<input id="${id}" value="${esc(value)}" autocomplete="off">`}</label>${help
  ? `<button type="button" class="q" aria-expanded="false" aria-label="Explain">?</button>` : ""}</div>${help ? `<div class="help" hidden>${help}</div>` : ""}</div>`;
const group = (labelText, help, inner, one = false) => `<div data-help><div class="row"><div class="glabel grow">${labelText}</div>
  <button type="button" class="q" aria-expanded="false" aria-label="Explain">?</button></div><div class="${one ? "tags1" : "wrap"}">${inner}</div><div class="help" hidden>${help}</div></div>`;
/** Why texts: safety first, then ease. Shown under a light "?" next to sensitive choices. */
const WHY = {

  sources: "Messages come through Beeper, read-only: the app can never send. Email and document alerts are the notifications your Outlook or Gmail app already shows on this phone (sender, subject, first lines), so there is no extra password to give. For the full text of work emails, the optional Microsoft sign-in is read-only and revocable anytime from your Microsoft account.",

const whyTitle = (title, key) => `<div data-help><div class="row"><h2 class="grow">${title}</h2><button type="button" class="q" aria-expanded="false" aria-label="Why">?</button></div><div class="help" hidden>${WHY[key]}</div></div>`;
const tag = (on, attrs, text, cls = "") => `<button type="button" class="tag ${cls}" aria-pressed="${on}" ${attrs}>${text}</button>`;
function single(host, attr, setter) { host.querySelectorAll(`[${attr}]`).forEach(b => b.addEventListener("click", () => {
  host.querySelectorAll(`[${attr}]`).forEach(x => x.setAttribute("aria-pressed", "false")); b.setAttribute("aria-pressed", "true"); setter(b.getAttribute(attr)); })); }
function multi(host, attr, list) { host.querySelectorAll(`[${attr}]`).forEach(b => b.addEventListener("click", () => {
  const v = b.getAttribute(attr), i = list.indexOf(v); if (i >= 0) list.splice(i, 1); else list.push(v); b.setAttribute("aria-pressed", String(i < 0)); })); }

const dateField = (id, labelText, value, help) => `<div data-help><div class="fieldrow"><label class="field"><span>${labelText}</span><input type="date" id="${id}" value="${esc(value || "")}"></label>${help
  ? `<button type="button" class="q" aria-expanded="false" aria-label="Explain">?</button>` : ""}</div>${help ? `<div class="help" hidden>${help}</div>` : ""}</div>`;
/** Existing projects show under the field only while it is focused, filtered as you type, with "Create" for a new name. */
function projectMenu(input, menu, names, onPick, createLabel = "Create") {
  const draw = () => {
    const q = input.value.trim(), lq = q.toLowerCase();
    const matches = names.filter(n => !lq || n.toLowerCase().includes(lq));
    const exact = names.some(n => n.toLowerCase() === lq);
    menu.innerHTML = (q && !exact ? `<button type="button" class="create" data-pick="${esc(q)}">${createLabel} “${esc(q)}”</button>` : "") +
      matches.map(n => `<button type="button" data-pick="${esc(n)}">${esc(n)}</button>`).join("");
    menu.hidden = !menu.innerHTML;
  };
  input.addEventListener("focus", draw);
  input.addEventListener("input", draw);
  input.addEventListener("blur", () => setTimeout(() => { menu.hidden = true; }, 150));
  menu.addEventListener("mousedown", e => e.preventDefault());
  menu.addEventListener("click", e => { const b = e.target.closest("[data-pick]"); if (!b) return; onPick(b.dataset.pick); menu.hidden = true; input.blur(); });
}
/** Step-by-step list: + in front of a step adds one above it, the pencil changes it, − removes it.
 *  Done steps stay as they are. Items are {id, title, done}; new ones have no id. */
function stepsEditor(box, steps, preview) {
  let editing = -1;
  const draw = () => {
    const pv = preview ? preview() : null;
    const openIdx = steps.map((x, i) => (!x.done && x.title.trim()) ? i : -1).filter(i => i >= 0);
    const dayLine = i => {
      const k = openIdx.indexOf(i); if (k < 0 || editing === i) return "";
      const d = pv && pv.days[k], next = openIdx[k + 1];
      const label = !pv ? "Choose a day" : !d || !d.date ? "No free cell yet" : dayName(d.date) + (steps[i].date ? " · your day" : "");
      return `<div class="sday"><label class="${d && d.late ? "late" : ""}">📅 ${label}<input type="date" data-sdate="${i}" value="${steps[i].date || (d && d.date) || ""}" aria-label="Day for step ${i + 1}"></label>
        ${steps[i].date ? `<button type="button" class="text" data-s="undate" data-i="${i}" aria-label="Let the planner choose">×</button>` : ""}<span class="grow"></span>
        ${next != null ? `<button type="button" class="text" data-s="join" data-i="${i}" data-j="${next}">Join with next ↓</button>` : ""}</div>`;
    };
    box.innerHTML = `<div class="steps">${steps.map((x, i) => (x.done
      ? `<div class="step done"><span></span><span class="n">✓</span><span>${esc(x.title)}</span><span></span></div>`
      : editing === i
      ? `<div class="step"><span></span><span class="n">${i + 1}</span><input id="step-edit" value="${esc(x.title)}" aria-label="Step ${i + 1}"><button type="button" class="icon" data-s="ok" aria-label="Keep">${ICON.check}</button></div>`
      : `<div class="step"><button type="button" class="icon" data-s="ins" data-i="${i}" aria-label="Add a step above">+</button><span class="n">${i + 1}</span><span>${esc(x.title)}${x.added ? ` <span class="small" style="color:var(--primary)">✚ added</span>` : ""}${x.wait ? `<span class="small" style="display:block;color:var(--muted)">⏳ waits ${x.wait} work day${x.wait > 1 ? "s" : ""}${x.why ? " for " + esc(x.why) : ""}</span>` : ""}</span>
         <span class="tools2"><button type="button" class="icon" data-s="edit" data-i="${i}" aria-label="Change this step">${ICON.edit}</button><button type="button" class="icon" data-s="del" data-i="${i}" aria-label="Remove this step">${ICON.minus}</button></span></div>`) + dayLine(i)).join("")}
      ${pv && pv.moved.length ? `<div class="small">To meet the deadline, these move later: ${esc(pv.moved.join(", "))}.</div>` : ""}
      ${pv && pv.pace ? `<div class="small" style="color:var(--muted)">📐 Paced to the deadline: steps spread over the time you have, ${pv.pace.buffer} work days kept as a buffer${pv.pace.crossesBreak ? "; Quebec holidays and the winter break (Dec 24 – Jan 2) skipped" : "; holidays skipped"}.</div>` : ""}
      <div class="step"><span></span><span></span><input id="step-new" placeholder="Add a step..." aria-label="New step" style="border-color:var(--outline)"><button type="button" class="icon" data-s="add" aria-label="Add">+</button></div></div>`;
    box.querySelectorAll("[data-sdate]").forEach(inp => inp.addEventListener("change", () => { if (validDate(inp.value)) { steps[+inp.dataset.sdate].date = inp.value; draw(); } }));
    const ed = $("#step-edit"); if (ed) { ed.focus(); ed.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); commit(); } }); }
    $("#step-new").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); add(); } });
  };
  const commit = () => { const v = $("#step-edit").value.trim(); if (v) steps[editing].title = v; else steps.splice(editing, 1); editing = -1; draw(); };
  const add = () => { const v = $("#step-new").value.trim(); if (v) { steps.push({ title: v, done: false }); draw(); $("#step-new").focus(); } };
  box.addEventListener("click", e => {
    const b = e.target.closest("[data-s]"); if (!b) return;
    const a = b.dataset.s, i = +b.dataset.i;
    if (a === "ok") return commit();
    if (a === "add") return add();
    if (editing >= 0 && $("#step-edit")) { const v = $("#step-edit").value.trim(); if (v) steps[editing].title = v; else { steps.splice(editing, 1); if (i > editing) return (editing = -1, draw()); } }
    editing = -1;
    if (a === "edit") editing = i;
    if (a === "ins") { steps.splice(i, 0, { title: "", done: false }); editing = i; }
    if (a === "del") steps.splice(i, 1);
    if (a === "undate") steps[i].date = null;
    if (a === "join") { const j = +b.dataset.j, x = steps[i], y = steps[j]; steps[i] = { ...x, title: `${x.title} + ${y.title}`, id: x.id || y.id, date: x.date || y.date }; steps.splice(j, 1); }
    draw();
  });
  draw();
  return draw;
}

/** Extend: this task needs one more cell, either to continue the same work or for something required first. */
function extendDialog(t, st) {
  const wasSolo = !t.project;
  dialog(`<h3>${esc(cellTitle(t, st))}</h3><div class="body">
    <div class="small">This task needs one more cell:</div>
    <div class="actions" style="grid-template-columns:repeat(2,1fr)">
      <div class="action"><button class="round slate" data-a="cont" aria-label="Extend effort: one more cell of the same work">${ICON.cont}</button>Extend effort</div>
      <div class="action"><button class="round navy" data-a="before" aria-label="Related task: something needed to finish this task">${ICON.before}</button>Related task</div>
    </div>
    <div id="before-part" hidden>${field("x-before", "Related task", "", "Something needed to finish this task. It takes this cell, and this task moves to the next day.")}
      <div class="row" style="justify-content:flex-end"><button class="btn" data-a="before-ok">Add it</button></div></div>
    <div class="err" id="err"></div></div>
    <div class="foot"><button class="text" data-a="close">Close</button></div>`, host => {
    host.querySelectorAll("[data-a]").forEach(b => b.addEventListener("click", () => {
      const a = b.dataset.a;
      if (a === "close") return close();
      const from = st.date && st.date > TODAY ? st.date : TODAY;
      if ((a === "cont" || a === "before-ok") && wasSolo) { toProject(S, t); S.notice = { text: `“${t.title}” needs several cells, so it is now a project (green).`, warn: false }; }
      if (a === "cont") {
        const extra = newStep(`${st.title} (cont.)`);
        if (st.kind) extra.kind = st.kind; if (st.effort) extra.effort = st.effort;
        t.steps.splice(t.steps.indexOf(st) + 1, 0, extra);
        return placeOrMakeRoom(t, extra, nextFreeDayFor(t, nextWorkdayAfter(from)), () => { t.steps = t.steps.filter(x => x !== extra); });

/* ---------- Where: physical tasks have a place; joining them depends on the detour ---------- */
/** Example places with map points in km (in the app: the phone's own map lookup turns a name into a point). */
const PLACES = {
  "Home": [0, 0], "IGA Plateau": [1.5, 1], "Pharmacy Jean Brillon": [2, 0.5], "Post office Mont-Royal": [1, 2],
  "Hardware store Rosemont": [3.5, 3], "Costco Laval": [9, 19], "Office (Old Montreal)": [-2.5, -3], "Courthouse": [-2, -3.5],
};
const PLACE_WORDS = [
  [/\b(iga|groceries|grocery|épicerie|milk|bread|lait)\b/i, "IGA Plateau"], [/pharmac|prescription|medicine/i, "Pharmacy Jean Brillon"],
  [/parcel|post office|stamps|colis|poste/i, "Post office Mont-Royal"], [/hardware|screws|paint|batteries|light bulb|quincaillerie/i, "Hardware store Rosemont"],
  [/costco|bulk/i, "Costco Laval"], [/courthouse|palais de justice|file at the court/i, "Courthouse"], [/office|bureau/i, "Office (Old Montreal)"],
  [/contractor|kitchen|plumb|at home|house|maison/i, "Home"],
];
/** Physical: you must go somewhere (or be at home for it). Calls, emails and writing have no place. */
const PHYSICAL = /\bbuy\b|pick up|drop off|parcel|groceries|pharmac|costco|hardware|post office|go to|visit|deliver|return the|contractor|measure|courthouse|acheter|déposer|aller/i;
function guessWhere(text) { if (!PHYSICAL.test(text)) return ""; const m = PLACE_WORDS.find(([re]) => re.test(text)); return m ? m[1] : "?"; }
function km(a, b) { const p = PLACES[a], q = PLACES[b]; if (!p || !q) return null; return Math.round(Math.hypot(p[0] - q[0], p[1] - q[1]) * 10) / 10; }
function whereOf(t, st) { return (st && st.where) || t.where || ""; }

/* ---------- Ride along: a quick thing done during a cell already planned (same place or activity) ---------- */
/** Needs thinking or preparation first: never rides along. */
const NEEDS_PREP = /prepare|draft|write|study|analy|research|review|compare|plan\b|decide|negotiat|réd|prépar|étudi/i;
/** Something to buy or drop off: it goes on the errands trip. */
const ERRAND = /\bbuy\b|groceries|pharmacy|pick up|drop off|parcel|post office|return the|acheter|épicerie|pharmacie/i;
const TOPICS = [/renovat|kitchen|contractor|tile|cabinet|plumb|paint|floor|bathroom|rénov|cuisine/i, /acme/i, /notary|notaire|deed/i, /refinanc|mortgage|bank/i, /tax/i];
const STOPW = /^(with|from|about|this|that|their|your|ask|call|send|check|the|and|for|pour|avec)$/i;
/** The planned cell a new task could ride along with, and why; null when none fits or it needs preparation. */
function rideHost(title, explain, where) {
  const text = `${title} ${explain}`;
  if (NEEDS_PREP.test(text)) return { prep: true };
  const max = S.settings.maxDetour || 10;
  // Two places: close enough to join, or too far apart. An unknown place is never joined on a guess.
  const near = h => { const hw = whereOf(h.t, h.st); if (!where || !hw) return { ok: true };
    if (where === "?") return { ok: false, unknown: true }; const d = km(where, hw); return d == null ? { ok: false, unknown: true } : { ok: d <= max, d, hw }; };
  const open = S.tasks.flatMap(t => t.steps.filter(st => !st.done && !st.outcome && st.date && st.date >= TODAY).map(st => ({ t, st })));
  if (ERRAND.test(text)) {
    const trips = open.filter(({ t }) => t.errands).map(x => ({ ...x, n: near(x) }));
    const ok = trips.find(x => x.n.ok); if (ok) return { ...ok, errand: true, dist: ok.n };
    const far = trips[0]; if (far) return { far: true, ...far, dist: far.n, max };
    return { cart: true };
  }
  const words = text.toLowerCase().split(/[^a-zà-ÿ0-9]+/).filter(w => w.length > 4 && !STOPW.test(w));
  const scored = open.filter(({ t }) => !t.errands).map(x => {
    const host = `${x.t.title} ${x.st.title} ${x.t.desc || ""} ${x.st.desc || ""}`;
    const topic = TOPICS.some(re => re.test(text) && re.test(host));
    const shared = words.filter(w => host.toLowerCase().includes(w)).length;
    return { ...x, score: (topic ? 2 : 0) + shared };
  }).filter(x => x.score >= 2).sort((a, b) => b.score - a.score || (a.st.date < b.st.date ? -1 : 1));
  const best = scored[0]; if (!best) return null;
  const n = near(best); return n.ok ? { ...best, dist: n } : { far: true, ...best, dist: n, max };

/** Saves a project with its steps as edited in the form: chosen days first, then the planner, then room before the deadline. */
/**
 * A project with a deadline is spread over its real timeline: its steps start now and are paced up to a buffer before
 * the deadline (about 10% of the time, 2 work days at least), after each step's wait for others (feedback, signature),
 * on work days only (no holidays, no winter break). A tight deadline keeps the steps as soon as possible.
 */
let lastPace = null;
function paceProject(name, deadline) {
  lastPace = null;
  const h = projectTask(S, name); if (!h || !deadline) return null;
  const open = h.steps.filter(x => !x.done && !x.outcome && !x.pinned); if (!open.length) return null;
  const all = []; for (let d = TODAY; d < deadline; d = addDays(d, 1)) if (isWorkDay(d)) all.push(d);
  const buffer = Math.max(2, Math.round(all.length * 0.1));
  const days = all.slice(0, Math.max(open.length, all.length - buffer));
  if (days.length < open.length * 3) return null; // tight: as soon as possible
  const gap = Math.floor(days.length / open.length);
  let cursor = 0;
  open.forEach((st, i) => {
    const idx = Math.min(days.length - 1, Math.max(i === 0 ? 0 : i * gap, cursor + (st.wait || 0)));
    Object.assign(st, { notBefore: days[idx], date: null, slot: null });
    cursor = idx + 1;
  });
  return lastPace = { buffer, lastDay: days[days.length - 1], crossesBreak: deadline.slice(5) <= "01-31" || deadline.slice(0, 4) > TODAY.slice(0, 4) };
}
/** Project-management basics the assistant adds when they are missing: the client's feedback (with its wait) and a final review. */
function pmFill(steps, explain) {
  const titles = steps.map(x => x.title.toLowerCase()).join(" | ");
  const out = steps.slice();
  const last = out.length ? out.length - 1 : 0;
  if (/client|customer|mandate|act\b|board|partner|feedback|approv/i.test(explain) && !/feedback|comment|approv|review by/.test(titles))
    out.splice(last, 0, { title: "Send the draft for feedback", done: false, wait: 0, added: true }, { title: "Integrate the feedback", done: false, wait: 5, why: "their feedback", added: true });
  if (out.length > 2 && !/final review|proofread|relecture|review/.test(titles))
    out.splice(out.length - 1, 0, { title: "Final review", done: false, wait: 0, added: true });
  return out;
}
function saveProjectWithSteps(proj, oldName, steps) {
  const holder = oldName ? projectTask(S, oldName) : null, keepTitle = holder && holder.title;
  saveProject(S, proj, oldName);
  const list = steps.filter(x => x.done || x.title.trim());
  applyProjectSteps(proj.name, proj.notes, list, holder, keepTitle);
  paceProject(proj.name, proj.deadline);
  const h = projectTask(S, proj.name);
  if (h) { const open = h.steps.filter(x => !x.done && !x.outcome); list.filter(x => !x.done).forEach((x, k) => { if (x.date && open[k] && open[k].date !== x.date) pinStepTo(S, open[k], x.date); }); }

/** Writes the edited step list back to the project's own task. Done, pushed and cancelled cells stay;
 *  open steps follow the new list and order, and are placed again by the planner. */
function applyProjectSteps(name, notes, list, holder, oldTitle) {
  let t = holder && S.tasks.includes(holder) ? holder : null;
  const open = list.filter(x => !x.done);
  if (!t && !open.length) return;
  if (!t) { t = newTask(S, { title: name, project: name, steps: ["x"] }); t.steps = []; }
  if (t.title === oldTitle) t.title = name;
  t.desc = notes || t.desc;
  const closed = t.steps.filter(x => x.done || x.outcome);
  const reopened = open.map(x => {
    const old = x.id && t.steps.find(s => s.id === x.id);
    if (old) { old.title = x.title.trim(); old.wait = x.wait || 0; old.why = x.why || ""; if (!old.pinned) { old.date = null; old.slot = null; } return old; }
    return { id: uid(), title: x.title.trim(), done: false, date: null, slot: null, pinned: false, outcome: null, notBefore: null, wait: x.wait || 0, why: x.why || "" };
  });
  t.steps = [...closed, ...reopened];
  if (!t.steps.length) S.tasks = S.tasks.filter(x => x !== t);
  const pr = findProject(S, name); if (pr && t.desc !== undefined) t.desc = pr.notes || t.desc;
}

/* ---------- Progress: how each project is doing against its timeline ---------- */
function projectStats(s, p) {
  const t = projectTask(s, p.name);
  const steps = t ? t.steps.filter(x => x.outcome !== "CANCELLED" && x.outcome !== "PUSHED" && x.outcome !== "PARKED" && x.outcome !== "MISSED") : [];
  const done = steps.filter(x => x.done).length, total = steps.length;
  const dates = steps.map(x => x.date).filter(Boolean).sort();
  const e = projectEnd(s, p.name);
  const start = dates[0] || TODAY;
  const next = steps.filter(x => !x.done && x.date).sort((a, b) => a.date < b.date ? -1 : 1)[0];
  return { done, total, pct: total ? Math.round(done / total * 100) : 0, start, end: e.end, late: e.late, deadline: p.deadline, next, open: e.open,
    doneOn: total && done === total ? steps.map(x => x.date).filter(Boolean).sort().pop() : null };
}

const PRESET_NAMES = { neutral: "Neutral", lawyer: "Lawyer in practice", founder: "Founder", parent: "Parent and pro", employee: "Employee", work: "Work only", custom: "My profile" };
/** Presets work like an equalizer's: each keeps its own adjustments, and switching never loses them.
 *  Custom starts as a copy of what is shown. */
/**
 * Who you are, as tags you combine: each tag sets how much the attributes count for that side of you; together, each
 * attribute takes the highest. No tag = Neutral (all ●●○). A tap on a bar is your own adjustment, kept on top.
 */
const W = (home, admin, career, money, invest, rel, health, joy) => ({ Home: home, Admin: admin, Career: career, Money: money, Invest: invest, Relations: rel, Health: health, Joy: joy });
const TAG_PRESETS = {
  Parent: { w: W(2, 2, 2, 2, 1, 3, 2, 2), min: { Relations: 4 } },
  Founder: { w: W(1, 1, 3, 2, 3, 2, 2, 1) },
  Investor: { w: W(1, 2, 1, 3, 3, 1, 1, 1) },
  Lawyer: { w: { ...W(1, 2, 3, 3, 1, 2, 2, 1), Learning: 2 } },
  Employee: { w: { ...W(1, 1, 3, 2, 1, 2, 2, 2), Learning: 2 } },
  Passionate: { w: W(1, 1, 3, 1, 1, 2, 2, 3) },
};
function allTags() { return { ...TAG_PRESETS, ...(S.customTags || {}) }; }
/** The attributes and their weights from the tags, the user's own adjustments on top; meanings and minimums kept. */
function computeValues() {
  const tags = (S.tags || []).map(t => allTags()[t]).filter(Boolean), adj = S.adjust || {}, prev = Object.fromEntries((S.values || []).map(v => [v.name, v]));
  const names = ATTRS.map(a => a.name);
  if (tags.some(t => t.w.Learning)) names.splice(5, 0, "Learning");
  (S.extraValues || []).forEach(v => { if (!names.includes(v.name)) names.push(v.name); });
  S.values = names.map(n => {
    const base = ATTRS.find(a => a.name === n) || (n === "Learning" ? LEARNING : (S.extraValues || []).find(v => v.name === n));
    const fromTags = tags.length ? Math.max(1, ...tags.map(t => t.w[n] || 0)) : 2;
    const min = Math.max(0, ...tags.map(t => (t.min || {})[n] || 0));
    return { ...base, ...(prev[n] ? { meaning: prev[n].meaning, min: prev[n].min || min } : { min }), name: n, bucket: base.bucket, weight: adj[n] || fromTags };
  });
  plan(S);
}

let setQ = "";
function tileize(page) {
  const screen = $("#screen"), kids = [...screen.children];
  const isHead = e => e.tagName === "H2" || (e.matches("[data-help]") && e.querySelector("h2"));
  const groups = []; let cur = null; const intro = [];
  kids.forEach(e => { if (isHead(e)) { cur = { title: (e.tagName === "H2" ? e : e.querySelector("h2")).textContent.trim(), els: [e] }; groups.push(cur); } else if (cur) cur.els.push(e); else intro.push(e); });

    const q = setQ.trim().toLowerCase(), words = q ? [q, ...(SYN[q.replace(/s$/, "")] || "").split(" ").filter(Boolean)] : [];
    let found = 0;
    groups.forEach(g => {
      g.els.forEach(e => e.hidden = true);
      if (!q) return;
      const hit = g.blocks.filter(bl => words.some(w => bl.map(e => e.textContent.toLowerCase()).join(" ").includes(w)) || words.some(w => g.title.toLowerCase().includes(w)));

    host.querySelector("[data-a=test]").addEventListener("click", () => {

      if (!k) { out.style.color = "var(--error)"; return out.textContent = "The box is empty. Tap Paste, or long-press the box and choose Paste."; }
      if (!k.startsWith(P.prefix)) { out.style.color = "var(--error)"; return out.textContent = `This doesn't look like a ${P.name} key. It should start with ${P.prefix}. Copy it again from ${P.site}.`; }
      if (k.length < 12) { out.style.color = "var(--error)"; return out.textContent = "The key looks cut off. Copy the whole line again."; }
      ok = true; save.disabled = false; out.style.color = "var(--fg)";
      out.innerHTML = `<strong>Connected ✓</strong> ${P.name} answered. <span class="small">(Simulated in the preview. The app makes a real one-line test and explains any problem, such as “no credit on the account yet”.)</span>`;
    });
    save.addEventListener("click", () => {
      if (!ok) return;
      const k = $("#ai-key").value.trim();
      S.ai = { provider, last4: k.slice(-4) }; // the key itself is never kept in the preview
      close(); render(); if (gsResume != null) { const n = gsResume; gsResume = null; getStarted(n); }
    });
  });
}

function describe() {
  const L = [];

  for (const r of rows(S, TODAY, 14)) L.push(`${label(r.date, "en")} ${r.date} | ` + r.cells.map(c => c ? `[${c.st.done ? "x" : c.st.outcome === "PUSHED" ? ">" : c.st.outcome ? "-" : " "}] ${cellTitle(c.t, c.st)} (step ${c.st.id})` : "·").join(" | "));
  if (S.values.length) { L.push("", "BUCKETS: every task serves Ground (keeps life running), Build (moves something forward) or Nourish (gives energy), at work or at home. Equalizer: " + BK.map(k => `${BUCKETS[k].name} ${bucketShare()[k]}%`).join(", ") + ".", "VALUES (what matters to the user, weight 1-3, with their bucket)"); S.values.forEach(v => L.push(`- ${v.name} [${BUCKETS[v.bucket || "ground"].name}] weight=${v.weight}${v.min ? " min_per_week=" + v.min : ""}${v.meaning ? ": " + v.meaning : ""}`));
  if ((S.serveLessons || []).length) { L.push("", "HOW THE USER RATES TASKS (their own corrections, 0-3 per attribute; rate similar tasks the same way)"); S.serveLessons.slice(0, 15).forEach(l => L.push(`- ${l.title}: ${Object.entries(l.serve).map(([k, v]) => k + " " + v).join(", ")}`)); }
    const g = gaps(S); if (g.length) L.push("BALANCE this week, below minimum: " + g.map(x => `${x.v.name} ${x.n}/${x.v.min}`).join(", ")); }
  if (S.about.easy.length || S.about.hard.length) { L.push("", "ABOUT THE USER"); if (S.about.easy.length) L.push("- easy or enjoyable for them: " + S.about.easy.join(", ")); if (S.about.hard.length) L.push("- they tend to put off: " + S.about.hard.join(", ")); }
  if (S.projects.length) { L.push("", "PROJECTS (steps in order; [x] done)"); S.projects.forEach(p => {
    if (isIdea(S, p)) return L.push(`- ${p.name} IDEA (parked, not started, no cells)${p.notes ? ": " + p.notes : ""}`);
    const h = projectTask(S, p.name), e = projectEnd(S, p.name);

    if (h) h.steps.filter(x => !x.outcome).forEach((x, k) => L.push(`    ${k + 1}. [${x.done ? "x" : " "}] ${x.title}${x.date ? " on " + x.date : ""}${kindOf(h, x) !== "TASK" ? " " + kindOf(h, x).toLowerCase() : ""}${effOf(h, x) !== "NORMAL" ? " effort=" + effOf(h, x).toLowerCase() : ""} (step ${x.id})`));
  }); }
  const open = S.tasks.filter(t => !t.project && t.steps.some(x => !x.done && !x.outcome));
  if (open.length) { L.push("", "ONE-CELL TASKS"); open.forEach(t => L.push(`- ${t.id}: ${t.title}${t.project ? ` [${t.project}]` : ""} priority=${t.priority}${t.kind !== "TASK" ? " " + t.kind.toLowerCase() : ""}${t.effort !== "NORMAL" ? " effort=" + t.effort.toLowerCase() : ""}${t.pushes ? ` pushed ${t.pushes}x` : ""}${t.deadline ? " deadline=" + t.deadline : ""}${t.values.length ? " values=" + t.values.join("/") : ""}\n    explanation: ${t.desc}`)); }

}

function systemPrompt() {
  const d = new Date();
  return `You are the Docket 5 assistant, a planning assistant for legal professionals and business people who juggle many matters and personal obligations. Many of them get scattered easily or have ADD, so keep things simple and concrete.
Their whole method is a table: one line per day, five cells per day, one task per cell. A cell turns yellow when done. Five is the limit.
You manage that table with your tools. The planner places cells for you and enforces the 5-per-day limit; you decide what the tasks are, how to split them into steps, and what they serve. Never invent task or step ids.
Today is ${d.toLocaleDateString("en", { weekday: "long" })} ${TODAY}. The planner fills Monday to Friday.
Every task has an explanation (description); always write a clear one.
TO BUY: things to buy never take a cell each. When the user mentions buying something, or uses one of their shopping words (${S.settings.buyWords.join(", ")}), call add_to_buy (home or work; needed_by only if they said when). When the list is worth a trip (5 things, or one needed soon), offer once to plan_errands: one Errands cell for the whole list.
TENANT AND REPAIR REQUESTS: a tenant's request (leak, broken appliance, noise, heating...) is a project named "Building · Unit · Issue" (e.g. "12 Main · Apt 3 · Leak"); put the tenant's name, phone and access details in its notes. Steps: reply to the tenant (today, within 24 hours) → visit and diagnose → get 2 quotes (if a contractor is needed) → book the contractor → confirm with the tenant that it is fixed. A tiny fix (a bulb, a battery) is one task, not a project. The first reply to the tenant is always the most urgent step: it protects the landlord's reputation.
A FULL DAY: when the user wants something on a day (often today) that is full, the day matters to them. Never just refuse or pick another day: call move_step; when it says the day is full, propose in one short question which cell moves later (the least important by priority, values and deadlines; never a meeting or deadline unless they say so), and where it goes. When they agree or name another, finish it with move_step make_room_with. SWAPS: when they ask to swap or exchange two cells, use swap_cells so both move at once; never leave a swap half done. After any move, say in one line where each moved cell is now.
TWO LEVELS ONLY, to keep things simple: a TASK is one cell (blue). Anything that needs several cells in an order is a PROJECT of steps (green); never make a task with sub-steps. Priority and deadline belong to projects. When the user describes something with several steps, agree on priority, deadline and steps, save_project, then add_task with that project and steps (they are appended in order). A project that must be done before another one "unlocks" it (save_project blocks) and takes its importance. Mark meetings with kind=meeting and deliveries or filings due that day with kind=deadline.
VALUES AND EFFORT: weigh the user's values in every choice and name the value at stake when you explain a trade-off. Tag tasks and projects with the values they serve. Set each task's effort as it will feel to THIS user. At most 2 heavy cells a day. For a heavy task make the first step tiny and easy to start, and follow heavy work with something easy or enjoyable. When a task was pushed twice or more, ask ONE short question: split it, smaller first step, or hand it off? When a value is below its weekly minimum, suggest one concrete thing for it.
LEARNING ABOUT THE USER: never run a questionnaire. When a message starts with "ABOUT ME:", turn it into set_value and set_about calls.
MEETINGS: to find a time for someone, call find_slots, then draft_message with 2 or 3 of the times in the recipient's language. When the person accepts, book_meeting.
When a message starts with "For <day> <date>:", put what they describe on that day with add_task on_day.
Answer in the language of the user's latest message (English or French).
RULES, in priority order:
${S.rules.filter(r => r.on).map((r, i) => `${i + 1}. ${r.text}`).join("\n")}
UNDERSTANDING BEFORE ACTING: if something that matters is unclear, ask ONE short question and wait.${S.settings.confirm ? " Changes you make are STAGED (the tool result says so). After staging, say in one or two short sentences what will change and ask for confirmation. The app applies them when the user says yes." : ""}
${S.memory.length ? "WHAT YOU KNOW ABOUT THE USER:\n" + S.memory.map(m => "- " + m).join("\n") : ""}
Keep answers short: at most 5 lines, no markdown tables.`;
}

function summary(name, i) {
  const task = id => (S.tasks.find(t => t.id === id) || {}).title, step = id => { const f = findStep(S, id); return f && cellTitle(f.t, f.st); };
  switch (name) {
    case "add_task": return `add "${i.title}"${(i.steps || []).length > 1 ? ` in ${i.steps.length} steps` : ""}${i.fixed_date || i.on_day ? " on " + (i.fixed_date || i.on_day) : ""}${i.project ? ` (${i.project})` : ""}`;
    case "set_step_status": return ({ done: "mark", todo: "reopen", pushed: "push", cancelled: "cancel" }[i.status] || i.status) + ` "${step(i.step_id)}"${i.status === "done" ? " done" : ""}`;
    case "update_task": return `change "${task(i.task_id)}"`;
    case "delete_task": return `delete "${task(i.task_id)}" and all its cells`;
    case "add_to_buy": return `add to the To buy list: ${(i.items || []).join(", ")}${i.for_work ? " (work)" : ""}`;
    case "plan_errands": return `plan one Errands cell${i.date ? " on " + i.date : ""} for the things to buy`;
    case "move_step": return `move "${step(i.step_id)}" to ${i.date}${i.make_room_with ? ` and move "${step(i.make_room_with)}" later` : i.make_room ? " (a less important cell moves later if the day is full)" : ""}`;
    case "swap_cells": return `swap "${step(i.step_a)}" and "${step(i.step_b)}"`;
    case "save_project": return `save the project "${i.name}"${i.priority ? ", " + String(i.priority).toLowerCase() + " priority" : ""}${i.deadline ? ", due " + i.deadline : ""}`;
    case "set_value": return i.remove ? `remove the value "${i.name}"` : `set the value "${i.name}"${i.weight ? ", weight " + i.weight : ""}${i.min_per_week ? `, at least ${i.min_per_week} a week` : ""}`;
    case "set_about": return `remember${i.easy ? " easy for you: " + i.easy.join(", ") : ""}${i.hard ? "; you put off: " + i.hard.join(", ") : ""}`;
    case "add_rule": return `add the rule "${i.text}"`;
    case "book_meeting": return `book "${i.title}" on ${i.date} at ${i.start}${i.with ? " with " + i.with : ""}`;
  }
  return name;
}
function check(name, i) {

  if (e.key === "Escape" && $("#scrim") && !document.querySelector(".dialog input:not([type=hidden]), .dialog textarea")) close();
  if (e.target.id && e.target.id.startsWith("add-") && e.key === "Enter") { const k = e.target.id.slice(4); if (e.target.value.trim()) S.about[k] = [...new Set([...S.about[k], e.target.value.trim()])]; render(); }
});

load(); ensureBuy();
// "Check when I open the app": one check per visit (in the app this also runs when you leave and at the set times).
if (S.checks && S.checks.onOpen) checkNow();
render();
samplePromise = window.claude ? window.claude.use("sample") : Promise.resolve(null);
samplePromise.then(() => { if (tab === "assistant") renderAssistantLive(); });
</script>

<style>

  --fg: #E6E8EA; --muted: #A3ABB4; --primary: #C6D0DA;
  --k-task: #9DB8E8; --k-meet: #F1F1F1; --k-dead: #F2A7A0; --k-proj: #86D3A8; --bar: #5BBF8A;
  --dialog: rgba(28,32,36,.97); --scrim: rgba(0,0,0,.45); --error: #F2A7A0; color-scheme: dark } }
:root[data-theme="dark"] {

  --k-task: #9DB8E8; --k-meet: #F1F1F1; --k-dead: #F2A7A0; --k-proj: #86D3A8; --bar: #5BBF8A;

.mind-add .dictbtn { width: 44px; height: 44px; } .mind-add .dictbtn svg { width: 22px; height: 22px; }

.mwid.on { box-shadow: 0 0 0 3px var(--fg); } .mlegend { text-align: center; margin-top: -4px; } .mwt { font-weight: 600; font-size: 13px; } .mwm { font-size: 11px; color: var(--muted); }

  overflow: hidden; cursor: pointer; }

/* The strip: every attribute side by side, one small histogram each, the colour says the category. */

/* One-line "what it serves" in the cell menu: three equal blocks, the served one filled. */

.dialog .seg { flex: none; position: static; grid-template-columns: 1fr 1fr; margin: 0 0 6px; }

:root { --chrome: #2C3A4F; }

/* The frame: slate-navy header and footer, light middle. On the header, the categories take lighter tones. */

const GUESS = [
  [/routine|process|template|checklist|automat|auto-?pay|dashboard|workflow|habit|system\b|method|set up a|tracker/i, { Methodic: 2 }],
  [/bill|electric|internet|passport|form|tax|insur|appointment|document|deed|paper|admin|renewal|declar|budget/i, { Organized: 2 }],

  [/client|offer|\bcontract\b|brief|court|filing|kick-off|meeting|case|motion|pitch|acme|notary/i, { Reputation: 2, Money: 1 }],
  [/invoice|collect|fees|billing|sale|salary/i, { Money: 2 }],
  [/refinanc|mortgage|invest|savings|loan|property|renovat|portfolio|brand/i, { Invest: 2 }],
  [/dinner|brother|sister|friend|family|kids|son|daughter|parents|wife|husband|partner/i, { Relations: 3 }],
  [/gym|sport|run\b|walk|doctor|dentist|sleep|yoga|health/i, { Health: 2 }],
  [/course|training|seminar|continuing|study|book|read/i, { Learning: 2, Health: 1 }],
  [/brakes|myself|guitar|weekend|vacation|lake|movie|hobby|fun|game|renovat|dinner/i, { Joy: 1 }],
];
function serveOf(t, st) {
  const pj = t.project && findProject(S, t.project);
  const saved = (st && st.serve) || t.serve || (pj && pj.serve);
  if (saved) return { ...saved };
  const text = `${t.title} ${st ? st.title : ""} ${t.desc || ""} ${t.project || ""}`;
  // Like a past correction the user saved: the assistant reuses it.
  const lesson = (S.serveLessons || []).find(l => l.words.some(w => text.toLowerCase().includes(w)));
  if (lesson) return { ...lesson.serve };
  const out = {};
  GUESS.forEach(([re, add]) => { if (re.test(text)) Object.entries(add).forEach(([k, v]) => out[k] = Math.max(out[k] || 0, v)); });
  Object.keys(out).forEach(k => { if (!S.values.some(v => v.name === k)) delete out[k]; });
  if (!Object.keys(out).length) out[t.project ? "Reputation" : "Organized"] = 1;
  return out;
}
/** The intention: why the task matters, in one sentence. Drafted from what it serves; the user corrects it. */
const INTENT = { Home: "keep the home running", Organized: "stay on top of my obligations", Methodic: "make life simpler and steadier", Reputation: "build my reputation (career or brand)", Money: "bring money in",
  Invest: "grow what I own", Learning: "get better at my work", Relations: "be there for the people who matter", Health: "take care of my health", Joy: "enjoy my life" };
function draftIntent(levels) {
  const top = Object.entries(levels).filter(([k]) => INTENT[k]).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([k]) => INTENT[k]);
  if (!top.length) return "";
  const t = top.join(" and "); return "To " + t + ".";
}
function intentionOf(t) { const p = t.project && findProject(S, t.project); return t.intention || (p && p.intention) || draftIntent(serveOf(t, null)); }
/** The category a task leans to most (for the weekly mix). */
function bucketOf(t, st) {
  const sv = serveOf(t, st), tot = { ground: 0, build: 0, nourish: 0 };
  Object.entries(sv).forEach(([n, l]) => { const a = S.values.find(v => v.name === n); if (a) tot[a.bucket] += l; });
  return BK.reduce((a, b) => tot[b] > tot[a] ? b : a, "ground");

/** Value for you: what the task serves times how much each attribute counts for you. */
function valueFor(sv) {
  const sc = Object.entries(sv).reduce((n, [k, l]) => n + l * ((S.values.find(v => v.name === k) || {}).weight || 0), 0);

/** The round buttons float: drag them anywhere so they never hide what you're reading. The place is remembered. */
let fabPos = (() => { try { return JSON.parse(localStorage.getItem("docket5-fab")) || { x: 0, y: 0 }; } catch (e) { return { x: 0, y: 0 }; } })(), fabDragged = false;
function floatFabs() {
  const el = document.querySelector("#fabs .fabs"); if (!el) return;
  const clamp = () => {
    const r = el.getBoundingClientRect(), dx = r.left - fabPos.x, dy = r.top - fabPos.y; // where it sits with no offset
    fabPos.x = Math.min(Math.max(fabPos.x, 8 - dx), innerWidth - 8 - (dx + r.width));
    fabPos.y = Math.min(Math.max(fabPos.y, 8 - dy), innerHeight - 8 - (dy + r.height));
  };
  const place = () => { el.style.transform = `translate(${fabPos.x}px, ${fabPos.y}px)`; };
  place(); clamp(); place();
  let start = null;
  el.addEventListener("pointerdown", e => { start = { px: e.clientX, py: e.clientY, x: fabPos.x, y: fabPos.y, moved: false }; });
  el.addEventListener("pointermove", e => {
    if (!start) return;
    const mx = e.clientX - start.px, my = e.clientY - start.py;
    if (!start.moved && Math.hypot(mx, my) < 8) return;
    if (!start.moved) { start.moved = true; el.setPointerCapture(e.pointerId); el.classList.add("dragging"); }
    fabPos.x = start.x + mx; fabPos.y = start.y + my; clamp(); place();
  });
  const end = () => {
    if (start && start.moved) { fabDragged = true; el.classList.remove("dragging"); try { localStorage.setItem("docket5-fab", JSON.stringify(fabPos)); } catch (x) { } setTimeout(() => fabDragged = false, 50); }
    start = null;
  };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
}

/* ---------- Where: physical tasks have a place; joining them depends on the detour ---------- */
/** Example places with map points in km (in the app: the phone's own map lookup turns a name into a point). */
const PLACES = {
  "Home": [0, 0], "IGA Plateau": [1.5, 1], "Pharmacy Jean Brillon": [2, 0.5], "Post office Mont-Royal": [1, 2],
  "Hardware store Rosemont": [3.5, 3], "Costco Laval": [9, 19], "Office (Old Montreal)": [-2.5, -3], "Courthouse": [-2, -3.5],
};
const PLACE_WORDS = [
  [/\b(iga|groceries|grocery|épicerie|milk|bread|lait)\b/i, "IGA Plateau"], [/pharmac|prescription|medicine/i, "Pharmacy Jean Brillon"],
  [/parcel|post office|stamps|colis|poste/i, "Post office Mont-Royal"], [/hardware|screws|paint|batteries|light bulb|quincaillerie/i, "Hardware store Rosemont"],
  [/costco|bulk/i, "Costco Laval"], [/courthouse|palais de justice|file at the court/i, "Courthouse"], [/office|bureau/i, "Office (Old Montreal)"],
  [/contractor|kitchen|plumb|at home|house|maison/i, "Home"],
];
/** Physical: you must go somewhere (or be at home for it). Calls, emails and writing have no place. */
const PHYSICAL = /\bbuy\b|pick up|drop off|parcel|groceries|pharmac|costco|hardware|post office|go to|visit|deliver|return the|contractor|measure|courthouse|acheter|déposer|aller/i;

function whereOf(t, st) { return (st && st.where) || t.where || ""; }

/* ---------- Ride along: a quick thing done during a cell already planned (same place or activity) ---------- */
/** Needs thinking or preparation first: never rides along. */
const NEEDS_PREP = /prepare|draft|write|study|analy|research|review|compare|plan\b|decide|negotiat|réd|prépar|étudi/i;

  if (NEEDS_PREP.test(text)) return { prep: true };
  const max = S.settings.maxDetour || 10;
  // Two places: close enough to join, or too far apart. An unknown place is never joined on a guess.
  const near = h => { const hw = whereOf(h.t, h.st); if (!where || !hw) return { ok: true };
    if (where === "?") return { ok: false, unknown: true }; const d = km(where, hw); return d == null ? { ok: false, unknown: true } : { ok: d <= max, d, hw }; };
  const open = S.tasks.flatMap(t => t.steps.filter(st => !st.done && !st.outcome && st.date && st.date >= TODAY).map(st => ({ t, st })));
  if (ERRAND.test(text)) {
    const trips = open.filter(({ t }) => t.errands).map(x => ({ ...x, n: near(x) }));
    const ok = trips.find(x => x.n.ok); if (ok) return { ...ok, errand: true, dist: ok.n };

  const scored = open.filter(({ t }) => !t.errands).map(x => {
    const host = `${x.t.title} ${x.st.title} ${x.t.desc || ""} ${x.st.desc || ""}`;
    const topic = TOPICS.some(re => re.test(text) && re.test(host));
    const shared = words.filter(w => host.toLowerCase().includes(w)).length;

  const h = rideHost(title, explain, where); rideChoice = null; box.dataset.host = "";

/** Saves a project with its steps as edited in the form: chosen days first, then the planner, then room before the deadline. */
/**
 * A project with a deadline is spread over its real timeline: its steps start now and are paced up to a buffer before
 * the deadline (about 10% of the time, 2 work days at least), after each step's wait for others (feedback, signature),
 * on work days only (no holidays, no winter break). A tight deadline keeps the steps as soon as possible.
 */
let lastPace = null;
function paceProject(name, deadline) {
  lastPace = null;
  const h = projectTask(S, name); if (!h || !deadline) return null;
  const open = h.steps.filter(x => !x.done && !x.outcome && !x.pinned); if (!open.length) return null;
  const all = []; for (let d = TODAY; d < deadline; d = addDays(d, 1)) if (canPlan(S, h, d)) all.push(d);
  const buffer = Math.max(2, Math.round(all.length * 0.1));
  const days = all.slice(0, Math.max(open.length, all.length - buffer));
  if (days.length < open.length * 3) return null; // tight: as soon as possible
  const gap = Math.floor(days.length / open.length);
  let cursor = 0;
  open.forEach((st, i) => {
    const idx = Math.min(days.length - 1, Math.max(i === 0 ? 0 : i * gap, cursor + (st.wait || 0)));
    Object.assign(st, { notBefore: days[idx], date: null, slot: null });
    cursor = idx + 1;
  });
  return lastPace = { buffer, lastDay: days[days.length - 1], crossesBreak: deadline.slice(5) <= "01-31" || deadline.slice(0, 4) > TODAY.slice(0, 4) };
}
/** Project-management basics the assistant adds when they are missing: the client's feedback (with its wait) and a final review. */
function pmFill(steps, explain) {
  const titles = steps.map(x => x.title.toLowerCase()).join(" | ");
  const out = steps.slice();
  const last = out.length ? out.length - 1 : 0;
  if (/client|customer|mandate|act\b|board|partner|feedback|approv/i.test(explain) && !/feedback|comment|approv|review by/.test(titles))
    out.splice(last, 0, { title: "Send the draft for feedback", done: false, wait: 0, added: true }, { title: "Integrate the feedback", done: false, wait: 5, why: "their feedback", added: true });
  if (out.length > 2 && !/final review|proofread|relecture|review/.test(titles))
    out.splice(out.length - 1, 0, { title: "Final review", done: false, wait: 0, added: true });
  return out;
}
function saveProjectWithSteps(proj, oldName, steps) {
  const holder = oldName ? projectTask(S, oldName) : null, keepTitle = holder && holder.title;
  saveProject(S, proj, oldName);

  applyProjectSteps(proj.name, proj.notes, list, holder, keepTitle);
  paceProject(proj.name, proj.deadline);
  const h = projectTask(S, proj.name);
  if (h) { const open = h.steps.filter(x => !x.done && !x.outcome); list.filter(x => !x.done).forEach((x, k) => { if (x.date && open[k] && open[k].date !== x.date) pinStepTo(S, open[k], x.date); }); }

/** Writes the edited step list back to the project's own task. Done, pushed and cancelled cells stay;
 *  open steps follow the new list and order, and are placed again by the planner. */
function applyProjectSteps(name, notes, list, holder, oldTitle) {
  let t = holder && S.tasks.includes(holder) ? holder : null;
  const open = list.filter(x => !x.done);
  if (!t && !open.length) return;
  if (!t) { t = newTask(S, { title: name, project: name, steps: ["x"] }); t.steps = []; }
  if (t.title === oldTitle) t.title = name;
  t.desc = notes || t.desc;
  const closed = t.steps.filter(x => x.done || x.outcome);
  const reopened = open.map(x => {
    const old = x.id && t.steps.find(s => s.id === x.id);
    if (old) { old.title = x.title.trim(); old.wait = x.wait || 0; old.why = x.why || ""; if (!old.pinned) { old.date = null; old.slot = null; } return old; }
    return { id: uid(), title: x.title.trim(), done: false, date: null, slot: null, pinned: false, outcome: null, notBefore: null, wait: x.wait || 0, why: x.why || "" };

  t.steps = [...closed, ...reopened];

function taskPrompt(words, names, current, curDay) {

${current ? `CURRENT TASK: title "${current.title}"; notes "${current.desc}"; type ${current.kind.toLowerCase()}; effort ${current.effort.toLowerCase()}; day ${curDay || "not placed"}.
Free cells per working day (5 a day): ${free.join(", ")}
Change the task as the user asks; keep everything else exactly as it is. Prefer a day with a free cell. Also give "reason": one short sentence saying what you changed and why.
The user's change request:` : "The user's words:"}
"""${words}"""
Reply with only a JSON object: {"title": string, "notes": string, "type": "task"|"meeting"|"deadline", "effort": "light"|"normal"|"heavy", "project": string, "day": string}.
- title: at most 6 words, what the cell shows. notes: 1 or 2 short sentences of context, from the user's words only.

- project: one of their projects if it clearly belongs to it, else empty. day: ${current ? "YYYY-MM-DD, the task's day after the change (the current one if unchanged)" : "YYYY-MM-DD only if the user named a day, else empty"}.
Write in the language of the user's words.`;

/** For the AI: how much time and how many free cells are left before a deadline. */
function timeLeft(deadline) {

function parkProject(name) {
  const h = projectTask(S, name); if (!h) return;
  h.steps.forEach(x => { if (!x.done && !x.outcome) Object.assign(x, { outcome: "PARKED", date: null, slot: null, pinned: false }); });

function resumeProject(name) {
  const h = projectTask(S, name); if (!h) return;
  h.steps.forEach(x => { if (x.outcome === "PARKED") Object.assign(x, { outcome: null }); });
  plan(S); const e = projectEnd(S, name);

const LAST_HOUR_TODAY = 14; // after this hour nothing new lands today
const KINDS = { task: "Task", step: "Step", quick: "Quick things", idea: "Idea", buy: "To buy", drop: "Drop" };
function listPrompt() {
  return `You organize a Docket 5 user's brain dump. Their table, projects and values:
${describe()}

${S.list.map((x, i) => `${i + 1}. ${x.text}`).join("\n")}

- "step": it belongs to an existing project (give "project" exactly as named above).
- "task": one focused piece of work, about 1.5 h or less. If it is something they put off, make "title" a small concrete first step.
- "quick": a 5 to 15 minute thing (a call, a short email, a form); several are grouped into one cell.

Order "rank" by importance: deadlines, what blocks a project, then their values. "due" only when a date is said (YYYY-MM-DD).

}
function heuristicSort() {
  const buy = S.settings.buyWords || BUY_WORDS;
  return S.list.map((x, i) => ({ line: i + 1, kind: buy.some(w => x.text.toLowerCase().includes(w)) ? "buy" : /^(call|appeler|email|écrire|send|envoyer)\b/i.test(x.text) ? "quick" : "task", title: x.text, project: "", rank: i + 1, due: "" }));
}
/** Places the sorted items on a state (the real one, or a copy to show the result first). */
function placeList(x, items) {
  // Free cells only (nothing planned moves); today too if there is still time.
  const start = new Date().getHours() < LAST_HOUR_TODAY ? TODAY : addDays(TODAY, 1), quick = [];
  items.slice().sort((a, b) => (a.rank || 99) - (b.rank || 99)).forEach(it => {
    const nb = start;
    if (it.kind === "buy") return x.buy.push({ id: uid(), text: it.title, work: false, needBy: it.due || null, done: false, errand: null });
    if (it.kind === "idea") return x.projects.push({ name: uniqueProjectName(x, it.title), priority: "NORMAL", deadline: null, notes: it.title, values: [], blocks: [] });
    if (it.kind === "drop") return;
    if (it.kind === "quick") return quick.push(it.title);
    const project = it.kind === "step" && findProject(x, it.project) ? findProject(x, it.project).name : "";
    newTask(x, { title: it.title, project, deadline: it.due || null }); lastAdded.forEach(st => st.notBefore = nb); it.ids = lastAdded.map(st => st.id);
  });
  for (let i = 0; i < quick.length; i += 6) {
    const batch = quick.slice(i, i + 6);
    newTask(x, { title: `Quick things (${batch.length})`, desc: batch.map(t => "• " + t).join("\n"), effort: "LIGHT" }); lastAdded.forEach(st => st.notBefore = start);
  }
  plan(x);
}
async function sortList() {
  if (!S.list.length) return;
  dialog(`<h3>Organizing your list…</h3><div class="body"><div class="small">Reading it with your projects, values and calendar.</div></div>`, () => {});
  let items = null;
  const sample = await samplePromise;
  if (sample) { try { const out = await sample.json(listPrompt(), { cache: false }); items = (out.items || []).map(it => ({ ...it, title: String(it.title || S.list[it.line - 1]?.text || "") })); } catch (e) { items = null; } }
  if (!items || !items.length) items = heuristicSort();
  showSorted(items);
}
function showSorted(items) {
  const x = JSON.parse(JSON.stringify(S)); placeList(x, items);
  const dayOf = it => { if (!it.ids) return ""; for (const t of x.tasks) for (const st of t.steps) if (st.id === it.ids[0]) return st.date ? dayName(st.date) : "when a cell frees up"; return ""; };
  const quickDay = (() => { const t = x.tasks.find(t => t.title.startsWith("Quick things") && !S.tasks.some(o => o.id === t.id)); const st = t && t.steps[0]; return st && st.date ? dayName(st.date) : ""; })();
  const count = k => items.filter(i => i.kind === k).length;
  const last = x.tasks.flatMap(t => t.steps).filter(st => st.date && !S.tasks.some(t => t.steps.some(o => o.id === st.id))).map(st => st.date).sort().pop();
  dialog(`<h3>Organized</h3><div class="body">
    <div class="small"><b>${items.length} things →</b> ${Object.keys(KINDS).filter(k => count(k)).map(k => { const n = count(k), w = KINDS[k].toLowerCase(); return `${n} ${n > 1 && (k === "task" || k === "step" || k === "idea") ? w + "s" : w}`; }).join(" · ")}${last ? `. The last one lands <b>${dayName(last)}</b>.` : "."}</div>
    <div class="small">Only free cells are used, around your calendar: nothing already planned moves. Work stays Monday to Friday.</div>
    <div style="display:flex;flex-direction:column;gap:6px">${items.slice().sort((a, b) => (a.rank || 99) - (b.rank || 99)).map(it => `<div class="card" style="padding:6px 10px">
      <div>${esc(it.title)}</div>
      <div class="small"><b>${KINDS[it.kind] || "Task"}</b>${it.kind === "step" && it.project ? " in " + esc(it.project) : ""}${it.kind === "quick" && quickDay ? " · " + quickDay : dayOf(it) ? " · " + dayOf(it) : ""}${it.due ? " · due " + dayName(it.due) : ""}</div></div>`).join("")}</div></div>
    <div class="foot"><button class="text" data-l="talk">Talk about it</button><button class="btn" data-l="place">Place them</button></div>`, host => {
    host.querySelector("[data-l=place]").addEventListener("click", () => { placeList(S, items); S.list = []; S.notice = { text: `What was on your mind is in your table${last ? ", until " + dayName(last) : ""}.`, warn: false }; save(); close(); render(); });
    host.querySelector("[data-l=talk]").addEventListener("click", () => { close(); goAssistant(`Help me organize my list:\n${S.list.map(i => "- " + i.text).join("\n")}`, true); });
  });

/* ---------- About me ---------- */
const PRESET_NAMES = { neutral: "Neutral", lawyer: "Lawyer in practice", founder: "Founder", parent: "Parent and pro", employee: "Employee", work: "Work only", custom: "My profile" };
/** Presets work like an equalizer's: each keeps its own adjustments, and switching never loses them.
 *  Custom starts as a copy of what is shown. */
/**
 * Who you are, as tags you combine: each tag sets how much the attributes count for that side of you; together, each
 * attribute takes the highest. No tag = Neutral (all ●●○). A tap on a bar is your own adjustment, kept on top.
 */
const W = (home, admin, career, money, invest, rel, health, joy, methodic = 2) => ({ Methodic: methodic, Home: home, Organized: admin, Reputation: career, Money: money, Invest: invest, Relations: rel, Health: health, Joy: joy });
const TAG_PRESETS = {
  Parent: { w: W(2, 2, 2, 2, 1, 3, 2, 2), min: { Relations: 4 } },
  Founder: { w: W(1, 1, 3, 2, 3, 2, 2, 1) },
  Investor: { w: W(1, 2, 1, 3, 3, 1, 1, 1) },
  Lawyer: { w: { ...W(1, 2, 3, 3, 1, 2, 2, 1), Learning: 2 } },
  Employee: { w: { ...W(1, 1, 3, 2, 1, 2, 2, 2), Learning: 2 } },
  Passionate: { w: W(1, 1, 3, 1, 1, 2, 2, 3) },
};
function allTags() { return { ...TAG_PRESETS, ...(S.customTags || {}) }; }
/** The attributes and their weights from the tags, the user's own adjustments on top; meanings and minimums kept. */
function computeValues() {
  const tags = (S.tags || []).map(t => allTags()[t]).filter(Boolean), adj = S.adjust || {}, prev = Object.fromEntries((S.values || []).map(v => [v.name, v]));
  const names = ATTRS.map(a => a.name);
  if (tags.some(t => t.w.Learning)) names.splice(5, 0, "Learning");
  (S.extraValues || []).forEach(v => { if (!names.includes(v.name)) names.push(v.name); });
  S.values = names.map(n => {
    const base = ATTRS.find(a => a.name === n) || (n === "Learning" ? LEARNING : (S.extraValues || []).find(v => v.name === n));
    const fromTags = tags.length ? Math.max(1, ...tags.map(t => t.w[n] || 0)) : 2;
    const min = Math.max(0, ...tags.map(t => (t.min || {})[n] || 0));
    return { ...base, ...(prev[n] ? { meaning: prev[n].meaning, min: prev[n].min || min } : { min }), name: n, bucket: base.bucket, weight: adj[n] || fromTags };

}

/** Extend = the same task, one more cell the same day. Full day: the lowest-impact cell is offered to push. */

  const add = slot => {

      out.textContent = "In the app, this puts the copied key in the box. In the preview, paste it yourself.";

    $("#ai-key").addEventListener("input", () => { ok = false; save.disabled = true; out.textContent = ""; });
    host.querySelector("[data-a=test]").addEventListener("click", () => {
      const k = $("#ai-key").value.trim();
      // Plain-words results, as the app gives them after a tiny test call.
      if (!k) { out.style.color = "var(--error)"; return out.textContent = "The box is empty. Tap Paste, or long-press the box and choose Paste."; }
      if (!k.startsWith(P.prefix)) { out.style.color = "var(--error)"; return out.textContent = `This doesn't look like a ${P.name} key. It should start with ${P.prefix}. Copy it again from ${P.site}.`; }

    });
  });

    const g = gaps(S); if (g.length) L.push("BALANCE this week, below minimum: " + g.map(x => `${x.v.name} ${x.n}/${x.v.min}`).join(", ")); }
  if (S.about.easy.length || S.about.hard.length) { L.push("", "ABOUT THE USER"); if (S.about.easy.length) L.push("- easy or enjoyable for them: " + S.about.easy.join(", ")); if (S.about.hard.length) L.push("- they tend to put off: " + S.about.hard.join(", ")); }

    if (h) h.steps.filter(x => !x.outcome).forEach((x, k) => L.push(`    ${k + 1}. [${x.done ? "x" : " "}] ${x.title}${x.date ? " on " + x.date : ""}${kindOf(h, x) !== "TASK" ? " " + kindOf(h, x).toLowerCase() : ""}${effOf(h, x) !== "NORMAL" ? " effort=" + effOf(h, x).toLowerCase() : ""} (step ${x.id})`));
  }); }

function systemPrompt() {
  const d = new Date();
  return `You are the Docket 5 assistant, a planning assistant for legal professionals and business people who juggle many matters and personal obligations. Many of them get scattered easily or have ADD, so keep things simple and concrete.
Their whole method is a table: one line per day, five cells per day, one task per cell. A cell turns yellow when done. Five is the limit.
You manage that table with your tools. The planner places cells for you and enforces the 5-per-day limit; you decide what the tasks are, how to split them into steps, and what they serve. Never invent task or step ids.
Today is ${d.toLocaleDateString("en", { weekday: "long" })} ${TODAY}. The planner fills Monday to Friday.
Every task has an explanation (description); always write a clear one.
TO BUY: things to buy never take a cell each. When the user mentions buying something, or uses one of their shopping words (${S.settings.buyWords.join(", ")}), call add_to_buy (home or work; needed_by only if they said when). When the list is worth a trip (5 things, or one needed soon), offer once to plan_errands: one Errands cell for the whole list.
TENANT AND REPAIR REQUESTS: a tenant's request (leak, broken appliance, noise, heating...) is a project named "Building · Unit · Issue" (e.g. "12 Main · Apt 3 · Leak"); put the tenant's name, phone and access details in its notes. Steps: reply to the tenant (today, within 24 hours) → visit and diagnose → get 2 quotes (if a contractor is needed) → book the contractor → confirm with the tenant that it is fixed. A tiny fix (a bulb, a battery) is one task, not a project. The first reply to the tenant is always the most urgent step: it protects the landlord's reputation.
A FULL DAY: when the user wants something on a day (often today) that is full, the day matters to them. Never just refuse or pick another day: call move_step; when it says the day is full, propose in one short question which cell moves later (the least important by priority, values and deadlines; never a meeting or deadline unless they say so), and where it goes. When they agree or name another, finish it with move_step make_room_with. SWAPS: when they ask to swap or exchange two cells, use swap_cells so both move at once; never leave a swap half done. After any move, say in one line where each moved cell is now.
TWO LEVELS ONLY, to keep things simple: a TASK is one cell (blue). Anything that needs several cells in an order is a PROJECT of steps (green); never make a task with sub-steps. Priority and deadline belong to projects. When the user describes something with several steps, agree on priority, deadline and steps, save_project, then add_task with that project and steps (they are appended in order). A project that must be done before another one "unlocks" it (save_project blocks) and takes its importance. Mark meetings with kind=meeting and deliveries or filings due that day with kind=deadline.
VALUES AND EFFORT: weigh the user's values in every choice and name the value at stake when you explain a trade-off. Tag tasks and projects with the values they serve. Set each task's effort as it will feel to THIS user. At most 2 heavy cells a day. For a heavy task make the first step tiny and easy to start, and follow heavy work with something easy or enjoyable. When a task was pushed twice or more, ask ONE short question: split it, smaller first step, or hand it off? When a value is below its weekly minimum, suggest one concrete thing for it.
LEARNING ABOUT THE USER: never run a questionnaire. When a message starts with "ABOUT ME:", turn it into set_value and set_about calls.
MEETINGS: to find a time for someone, call find_slots, then draft_message with 2 or 3 of the times in the recipient's language. When the person accepts, book_meeting.
When a message starts with "For <day> <date>:", put what they describe on that day with add_task on_day.
Answer in the language of the user's latest message (English or French).
RULES, in priority order:
${S.rules.filter(r => r.on).map((r, i) => `${i + 1}. ${r.text}`).join("\n")}
UNDERSTANDING BEFORE ACTING: if something that matters is unclear, ask ONE short question and wait.${S.settings.confirm ? " Changes you make are STAGED (the tool result says so). After staging, say in one or two short sentences what will change and ask for confirmation. The app applies them when the user says yes." : ""}
${S.memory.length ? "WHAT YOU KNOW ABOUT THE USER:\n" + S.memory.map(m => "- " + m).join("\n") : ""}
Keep answers short: at most 5 lines, no markdown tables.`;
}

function summary(name, i) {
  const task = id => (S.tasks.find(t => t.id === id) || {}).title, step = id => { const f = findStep(S, id); return f && cellTitle(f.t, f.st); };
  switch (name) {
    case "add_task": return `add "${i.title}"${(i.steps || []).length > 1 ? ` in ${i.steps.length} steps` : ""}${i.fixed_date || i.on_day ? " on " + (i.fixed_date || i.on_day) : ""}${i.project ? ` (${i.project})` : ""}`;
    case "set_step_status": return ({ done: "mark", todo: "reopen", pushed: "push", cancelled: "cancel" }[i.status] || i.status) + ` "${step(i.step_id)}"${i.status === "done" ? " done" : ""}`;
    case "update_task": return `change "${task(i.task_id)}"`;
    case "delete_task": return `delete "${task(i.task_id)}" and all its cells`;
    case "add_to_buy": return `add to the To buy list: ${(i.items || []).join(", ")}${i.for_work ? " (work)" : ""}`;
    case "plan_errands": return `plan one Errands cell${i.date ? " on " + i.date : ""} for the things to buy`;
    case "move_step": return `move "${step(i.step_id)}" to ${i.date}${i.make_room_with ? ` and move "${step(i.make_room_with)}" later` : i.make_room ? " (a less important cell moves later if the day is full)" : ""}`;
    case "swap_cells": return `swap "${step(i.step_a)}" and "${step(i.step_b)}"`;
    case "save_project": return `save the project "${i.name}"${i.priority ? ", " + String(i.priority).toLowerCase() + " priority" : ""}${i.deadline ? ", due " + i.deadline : ""}`;
    case "set_value": return i.remove ? `remove the value "${i.name}"` : `set the value "${i.name}"${i.weight ? ", weight " + i.weight : ""}${i.min_per_week ? `, at least ${i.min_per_week} a week` : ""}`;
    case "set_about": return `remember${i.easy ? " easy for you: " + i.easy.join(", ") : ""}${i.hard ? "; you put off: " + i.hard.join(", ") : ""}`;
    case "add_rule": return `add the rule "${i.text}"`;
    case "book_meeting": return `book "${i.title}" on ${i.date} at ${i.start}${i.with ? " with " + i.with : ""}`;
  }
  return name;
}
function check(name, i) {
  if (["set_step_status"].includes(name) && !findStep(S, String(i.step_id))) throw new Error("Unknown step " + i.step_id);
  if (["update_task", "delete_task"].includes(name) && !S.tasks.some(t => t.id === String(i.task_id))) throw new Error("Unknown task " + i.task_id);
  for (const k of ["deadline", "fixed_date", "on_day", "date", "from"]) if (i[k] && !validDate(String(i[k]))) throw new Error(`${k} must be an ISO date like 2026-10-15`);
}

        values: i.values || [], deadline: i.deadline, fixedDate: i.fixed_date, steps: i.steps || [] });

        "Cells: " + added.map(x => `${x.title} on ${x.date || "not placed"} (step ${x.id})`).join("; ");
    }
    case "add_to_buy": { const added = addToBuy(i.items || [], i.for_work, i.needed_by); return added.length ? `On the To buy list: ${added.join(", ")}. ${buyDue() ? "The list is now worth a trip: offer plan_errands." : ""}` : "Already on the list."; }

      const v = i.make_room_with ? on.find(c => c.x.id === String(i.make_room_with)) : movable[0];

      const da = a.st.date, sa = a.st.slot;

      if (kinds.includes(i.kind)) t.kind = up(i.kind); if (efforts.includes(i.effort)) t.effort = up(i.effort); if (Array.isArray(i.values)) t.values = i.values.map(String);

      if (i.remove) { if (k >= 0) S.values.splice(k, 1); return "Removed."; }

/**
 * A receipt read by rules, in any country: the total first, then the amounts printed between the subtotal and the
 * total that add up to it (each tax, however many, or none), and the tip. When the sums agree to the cent, it is
 * certain and no AI is used. Taxes printed after the total as "included" (VAT, TVA, IVA, MwSt) are read as included.
 */
function amountOf(s) {
  const m = String(s).match(/(-?\d{1,3}(?:[  .,']\d{3})*(?:[.,]\d{1,2})|-?\d+[.,]\d{2})\s*(?:[$€£¥]|CAD|USD|EUR|AED|CHF|GBP|MAD|EGP|DH)?\s*%?\s*$/i);
  if (!m || /%\s*$/.test(s.trim())) return null;
  let v = m[1].replace(/[  ']/g, "");
  const last = Math.max(v.lastIndexOf(","), v.lastIndexOf("."));
  if (last >= 0 && v.length - last - 1 <= 2) v = v.slice(0, last).replace(/[.,]/g, "") + "." + v.slice(last + 1); else v = v.replace(/[.,]/g, "");
  const n = parseFloat(v); return isNaN(n) ? null : { n, label: s.slice(0, m.index).replace(/[:\-–=]+\s*$/, "").trim() };
}
const R_TOTAL = /\b(total|grand total|montant|amount due|à payer|a payer|to pay|ttc|summe|gesamt|totale|importe|net à payer|balance due)\b/i;
const R_SUB = /\b(sub-?total|sous-?total|s\/?total|subtotal|ht\b|hors tax|before tax|avant tax|zwischensumme|netto|imponible|subtotale|net)\b/i;
const R_TIP = /\b(tip|pourboire|gratuity|gratuité|propina|trinkgeld|mancia|service charge)\b/i;
const R_TAX = /\b(tax|taxe|tps|tvq|gst|qst|hst|pst|tvh|vat|tva|iva|mwst|ust|igv|state|city|county|sales)\b/i;
const near = (a, b) => Math.abs(a - b) < 0.025;
function readReceiptText(text) {
  const raw = String(text || "").split(/\n/).map(x => x.trim()).filter(Boolean);
  const lines = raw.map((l, i) => ({ i, l, a: amountOf(l) }));
  const money = lines.filter(x => x.a && x.a.n > 0);
  if (!money.length) return null;
  const vendor = (raw.find(l => !amountOf(l) && /[a-z]/i.test(l)) || "").slice(0, 40);
  const dm = raw.join(" ").match(/\b(20\d\d)[-\/.](\d{1,2})[-\/.](\d{1,2})\b|\b(\d{1,2})[-\/.](\d{1,2})[-\/.](20\d\d|\d\d)\b/);
  // Day and month: whichever can't be a month (over 12) is the day; else day first, except in the US style MM/DD.
  const dmy = dm && !dm[1] ? (+dm[4] > 12 ? [+dm[4], +dm[5]] : +dm[5] > 12 ? [+dm[5], +dm[4]] : [+dm[4], +dm[5]]) : null;
  const date = dm ? (dm[1] ? `${dm[1]}-${pad(+dm[2])}-${pad(+dm[3])}` : `${dm[6].length === 2 ? "20" + dm[6] : dm[6]}-${pad(dmy[1])}-${pad(dmy[0])}`) : null;
  const totals = money.filter(x => R_TOTAL.test(x.a.label) && !R_SUB.test(x.a.label));
  const T = totals.length ? totals[totals.length - 1] : money.reduce((m, x) => x.a.n > m.a.n ? x : m);
  const tipL = money.find(x => R_TIP.test(x.a.label) && x.a.n < T.a.n);
  const tip = tipL ? tipL.a.n : 0;
  const rate = (a, s) => s > 0 ? Math.round(a / s * 10000) / 100 : null;
  const res = (sub, taxes, how, sure) => ({ vendor, date, total: T.a.n, subtotal: Math.round(sub * 100) / 100, tip,
    taxes: taxes.map(x => ({ label: x.a.label || "Tax", amount: x.a.n, rate: rate(x.a.n, sub) })), how, sure });
  // 1. A subtotal before the total: the amounts between them (tip aside) must close the sum.
  const subs = money.filter(x => x.i < T.i && x !== tipL && x.a.n <= T.a.n).sort((a, b) => (R_SUB.test(b.a.label) - R_SUB.test(a.a.label)) || b.a.n - a.a.n);
  for (const S0 of subs) {
    const between = money.filter(x => x.i > S0.i && x.i < T.i && x !== tipL && !R_TOTAL.test(x.a.label));
    const sum = between.reduce((n, x) => n + x.a.n, 0);
    if (near(S0.a.n + sum + tip, T.a.n) && between.every(x => x.a.n < S0.a.n * 0.35)) return res(S0.a.n, between, between.length ? `${between.length} tax${between.length > 1 ? "es" : ""} between the subtotal and the total` : "no tax on this receipt", true);
  }
  // 2. Taxes printed as included in the total (common in Europe and the Gulf).
  const incl = money.filter(x => x !== T && x !== tipL && R_TAX.test(x.a.label) && x.a.n < T.a.n * 0.3);
  if (incl.length) { const sub = T.a.n - tip - incl.reduce((n, x) => n + x.a.n, 0); return res(sub, incl, "taxes included in the total", true); }
  return { vendor, date, total: T.a.n, subtotal: null, tip, taxes: [], how: "the total only: the other amounts don't add up", sure: false };
}

/* Quick commands: understood on the phone when the whole sentence is clear and one cell matches; you confirm first. */
function stepByWords(words) {
  const ws = fold(words).split(/\s+/).filter(w => w.length >= 3 && !/^(the|les|des|une|cell|task|tache|tâche)$/.test(w)); if (!ws.length) return null;
  const hits = [];
  S.tasks.forEach(t => t.steps.forEach(st => { if (st.status === "done" || st.status === "cancelled") return; const ti = fold(cellTitle(t, st)); if (ws.every(w => ti.includes(w))) hits.push({ t, st }); }));
  return hits.length === 1 ? hits[0] : null;
}
function localCommand(text) {
  const t = text.trim().replace(/[.!]$/, "");
  let m;
  if ((m = t.match(/^(?:move|put|déplace|deplace|reporte|mets|bouge)\s+(.+?)\s+(?:to|on|à|a|au|pour)\s+(.+)$/i))) {
    const f = stepByWords(m[1]), d = dayInNote(m[2]); if (f && d) return { tool: "move_step", input: { step_id: f.st.id, date: d }, summary: `move “${cellTitle(f.t, f.st)}” to ${dayName(d)}` };
  }
  if ((m = t.match(/^(.+?)\s+(?:is\s+)?(?:done|finished|fait|terminé|termine|fini)$/i)) || (m = t.match(/^(?:done|fait|fini)\s*:?\s+(.+)$/i))) {
    const f = stepByWords(m[1]); if (f) return { tool: "set_step_status", input: { step_id: f.st.id, status: "done" }, summary: `mark “${cellTitle(f.t, f.st)}” done` };
  }
  if ((m = t.match(/^(?:buy|acheter|achète|achete)\s+(.+)$/i))) {
    const items = m[1].split(/,|\bet\b|\band\b/).map(x => x.trim()).filter(Boolean); return { tool: "add_to_buy", input: { items }, summary: `add to To buy: ${items.join(", ")}` };
  }
  if ((m = t.match(/^(?:call|phone|appeler|appelle|téléphoner à|telephoner a)\s+(.+?)\s+(today|tomorrow|aujourd'hui|demain|(?:next )?\w+day|lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)$/i))) {
    const d = dayInNote(m[2]); if (d) return { tool: "add_quick", input: { title: `Call ${m[1]}`, day: d }, summary: `⚡ quick thing “Call ${m[1]}” on ${dayName(d)}` };
  }
  return null;
}

/* Ask: send an order to one of your agents, or a research. Same cards as Notifications when the answer comes back. */

  { id: "contract-summary", name: "Contract summary", description: "Reads a contract and lists the key dates, parties and risks.", needs: ["Which contract (link or name)"], minutes: 5 },
];
const RESEARCH = [["purchase", "🛒", "A purchase", "Best options, prices, reviews", "A standing desk under $600, delivered in Montréal"],
  ["people", "👤", "A person", "Who they are, their role, how to reach them", "Who is the new legal director at ACME Inc.?"],
  ["service", "🛠️", "A service", "Providers near you, ratings, prices", "A plumber in Outremont available this week"]];

  const server = S.agentServer;
  dialog(`<h3><span class="grow">🤝 Ask</span><span class="small">next generation · preview</span></h3><div class="body" style="gap:8px">
    <div class="small">${esc(myName() === "Assistant" ? "Your assistant" : myName())} prepares the request; you check it and tap Send. The answer comes back as a card in Notifications.</div>
    <div class="rhead"><span>🔎 Research for me</span></div>
    ${RESEARCH.map(([k, ic, n, sub]) => `<button class="rrow" data-ask="r:${k}" style="text-align:left"><div class="t"><span style="width:22px">${ic}</span><b>${n}</b><span class="small">›</span></div><div class="sub">${sub}</div></button>`).join("")}

    ${server ? DEMO_AGENTS.map(a => `<button class="rrow" data-ask="a:${a.id}" style="text-align:left"><div class="t"><span style="width:22px">🤖</span><b>${esc(a.name)}</b><span class="small">~${a.minutes} min ›</span></div><div class="sub" style="white-space:normal">${esc(a.description)}</div></button>`).join("")
      : `<div class="small">Connect a server that follows the open agent contract (yours runs Clay). You enter its address and a token, once.</div><button class="btn outline" data-ask="connect" style="align-self:flex-start">＋ Connect my agents</button>`}

function connectAgents() {
  dialog(`<h3>Connect my agents</h3><div class="body">
    <div class="small">Your server, your agents: requests go straight from this phone to it, never through us. The address and token are stored encrypted on the phone.</div>
    ${pfield("ag-url", "Address (https)", "https://agents.example.com/mcp", "")}
    ${pfield("ag-token", "Token", "", "Given by whoever runs the server")}
    ${pfield("ag-label", "Name (optional)", "My server (Clay)", "")}
    <div class="small">Only agents that only prepare (never send, pay or delete) are shown.</div></div>
    <div class="foot"><button class="text" data-c="close">Cancel</button><button class="btn" data-c="ok">Connect</button></div>`, host => {
    host.querySelector("[data-c=close]").addEventListener("click", askSheet);

function orderDialog(o) {
  const r = o.kind === "research" ? RESEARCH.find(x => x[0] === o.key) : null;
  const title = r ? `${r[1]} Research: ${r[2].toLowerCase()}` : `🤖 ${o.agent.name}`;
  dialog(`<h3>${esc(title)}</h3><div class="body">
    ${r ? pfield("or-what", "What are you looking for?", "", r[4], true) : o.agent.needs.map((n, i) => pfield(`or-n${i}`, n, "", "")).join("") + pfield("or-what", "Anything else? (optional)", "", "", true)}
    ${r ? `<div class="wrap">${(o.key === "purchase" ? ["Best price", "Best reviewed", "Delivered fast"] : o.key === "people" ? ["Role and company", "How to reach them", "Shared contacts"] : ["Near me", "Available this week", "Best rated"]).map(c => tag(false, `data-chip="${c}"`, c)).join("")}</div>
      <div class="small">Searches the web with your own AI (about 5 to 10 cents). Every line cites its source.</div>` : `<div class="small">Your server's agent prepares it (about ${o.agent.minutes} minutes). It never sends, pays or deletes.</div>`}
    <div class="err" id="err"></div></div>
    <div class="foot"><button class="text" data-o="back">‹ Back</button><button class="btn" data-o="send">Check and send</button></div>`, host => {
    host.querySelectorAll("[data-chip]").forEach(b => b.addEventListener("click", () => b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true"))));
    host.querySelector("[data-o=back]").addEventListener("click", askSheet);
    host.querySelector("[data-o=send]").addEventListener("click", () => {
      const what = [...host.querySelectorAll("input, textarea")].map(x => x.value.trim()).filter(Boolean).join(" · ");
      if (!what) return $("#err").textContent = "Say what you need, in your words.";
      const chips = [...host.querySelectorAll("[data-chip][aria-pressed=true]")].map(b => b.dataset.chip);
      const order = what + (chips.length ? ` (${chips.join(", ")})` : "");
      dialog(`<h3>Ready to send</h3><div class="body"><div class="card"><div class="small">${r ? "Research" : "To " + esc(S.agentServer.label) + " › " + esc(o.agent.name)}</div><b>${esc(order)}</b></div>
        <div class="small">🔒 Nothing leaves until you tap Send.</div></div><div class="foot"><button class="text" data-s="edit">Change</button><button class="btn" data-s="go">Send</button></div>`, h2 => {
        h2.querySelector("[data-s=edit]").addEventListener("click", () => orderDialog(o));
        h2.querySelector("[data-s=go]").addEventListener("click", () => {
          const x = { id: uid(), title: r ? `Research: ${what.slice(0, 40)}` : o.agent.name, order, status: "working" };
          (S.orders ||= []).unshift(x); save();
          S.notice = { text: `Sent. The answer comes back in Notifications${r ? "" : ` (about ${o.agent.minutes} min)`}.`, warn: false }; close(); render();
          setTimeout(() => { x.status = "done"; x.result = r ? "3 options found, each with its source and price. Tap to compare." : "Ready: the document is in your OneDrive › Apps › Docket 5 › project › Reports.";
            S.updates.unshift({ id: uid(), source: r ? "research" : "agent", from: r ? "Research" : `${S.agentServer.label} › ${o.agent.name}`, title: x.title, summary: x.result, text: x.result, status: "seen", actions: [] });
            save(); render(); }, 4000);
        });
      });
    });
  });
}

  if (b.id === "reset") { S = exampleState(); renderTable.scrolled = false; return render(); }
});
document.addEventListener("input", e => { if (e.target.id === "rule-q") { ruleQ = e.target.value; $("#rule-list").innerHTML = rulesList(); } });
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.rule) { S.rules[+el.dataset.rule].on = el.checked; return render(); }
  if (el.id === "set-dark") { S.settings.theme = el.checked ? "dark" : "light"; return render(); }
  if (el.id === "set-focus") { S.checks.focus = el.checked; return render(); }
  if (el.id === "set-km") return;
  if (el.id === "set-buywords") { const w = el.value.split(",").map(x => x.trim()).filter(Boolean); S.settings.buyWords = w.length ? w : BUY_WORDS.slice(); save(); return; }
  if (el.id === "add-time" && el.value) { S.checks.times = [...new Set([...S.checks.times, el.value])].sort(); return render(); }
  if (el.id === "set-confirm") { S.settings.confirm = el.checked; return render(); }
  if (el.id === "set-windows") { const w = el.value.split(",").map(x => x.trim()).filter(x => /^\d{1,2}:\d{2}\s*[-–]\s*\d{1,2}:\d{2}$/.test(x)); if (w.length) S.meetings.windows = w; return render(); }
});
document.addEventListener("keydown", e => {
  if (e.target.id === "list-add" && e.key === "Enter") { e.preventDefault(); return document.querySelector('[data-act="list-add"]').click(); }
  if (e.target.id === "msg" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(e.target.value); }
  if (e.key === "Escape" && $("#scrim") && !document.querySelector(".dialog input:not([type=hidden]), .dialog textarea")) close();
  if (e.target.id && e.target.id.startsWith("add-") && e.key === "Enter") { const k = e.target.id.slice(4); if (e.target.value.trim()) S.about[k] = [...new Set([...S.about[k], e.target.value.trim()])]; render(); }
});

load(); ensureBuy();
// "Check when I open the app": one check per visit (in the app this also runs when you leave and at the set times).
if (S.checks && S.checks.onOpen) checkNow();
$("#tome").addEventListener("click", textToMe);
render();
samplePromise = window.claude ? window.claude.use("sample") : Promise.resolve(null);
samplePromise.then(() => { if (tab === "assistant") renderAssistantLive(); });

// The own-distance box: Apply appears as soon as a new number is typed (nothing is saved before the tap).
document.addEventListener("input", e => { if (e.target.id === "set-km") { const n = parseInt(e.target.value, 10); const b = $("#km-apply"); if (b) b.hidden = !(n > 0 && n !== (S.settings.maxDetour || 10)); } });
</script>

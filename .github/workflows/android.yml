name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image ships the Android SDK (ANDROID_HOME is set).
      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests
        run: ./gradlew :core:test --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Build release (unsigned, minified)
        run: ./gradlew :app:assembleRelease --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: tda-debug-apk
          path: app/build/outputs/apk/debug/*.apk
